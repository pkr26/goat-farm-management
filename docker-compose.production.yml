# Production Compose topology for signed registry images and an external,
# authenticated PostgreSQL service. This is intentionally a standalone file:
# do NOT layer it over docker-compose.yml, whose bundled TLS-off Postgres is
# local-development-only. See README for the required secret files and the
# outer TLS terminator that proxies only to the loopback edge listener.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-hardening: &service-hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *default-logging

x-db-ca: &db-ca
  type: bind
  source: '${GOATFARM_DB_CA_FILE:?set GOATFARM_DB_CA_FILE to the mounted PostgreSQL CA PEM}'
  target: /run/secrets/goatfarm-postgres-ca.pem
  read_only: true

# Each database-capable service gets its own secret directory. Keep DDL
# credentials in migration/, API HMAC/TOTP/metrics credentials in api/, and
# only worker DB/storage/provider credentials in worker/. Identical in-container
# paths remain compatible after splitting an older shared host directory.
x-api-secrets: &api-secrets
  type: bind
  source: '${GOATFARM_API_SECRET_DIR:-./secrets/api}'
  target: /run/secrets/app
  read_only: true

x-migration-secrets: &migration-secrets
  type: bind
  source: '${GOATFARM_MIGRATION_SECRET_DIR:-./secrets/migration}'
  target: /run/secrets/app
  read_only: true

x-worker-secrets: &worker-secrets
  type: bind
  source: '${GOATFARM_WORKER_SECRET_DIR:-./secrets/worker}'
  target: /run/secrets/app
  read_only: true

services:
  # Validate the exact --env-file before any database-capable service starts.
  # Compose otherwise discards misspelt root-file variables that it does not
  # interpolate, bypassing the API process's ordinary env typo guard.
  config-guard:
    image: '${GOATFARM_BACKEND_IMAGE_REPOSITORY:?set the backend registry repository}@${GOATFARM_BACKEND_IMAGE_DIGEST:?set its sha256 digest}'
    command: ["python", "scripts/compose_env_guard.py", "/run/config/compose.env"]
    restart: "no"
    read_only: true
    healthcheck:
      disable: true
    network_mode: none
    <<: *service-hardening
    mem_limit: 128m
    cpus: 0.25
    # Precedence probes (2026-10-02 audit): Compose interpolates shell
    # environment ahead of --env-file, so a shell export of a plain secret
    # alongside a file-route env file forwarded BOTH routes to consumers
    # while the guard — reading the file alone — saw only one. These
    # forwards resolve exactly like the consuming services' own
    # interpolations (shell first, file fallback), so the guard's
    # exactly-one-of check now sees what Compose would actually deliver.
    # Values it receives are the same secrets the env file itself already
    # carries into this container via the read-only bind; no new exposure.
    environment:
      GOATFARM_DATABASE_URL: '${GOATFARM_DATABASE_URL:-}'
      GOATFARM_DATABASE_URL_FILE: '${GOATFARM_DATABASE_URL_FILE:-}'
      GOATFARM_MIGRATION_DATABASE_URL: '${GOATFARM_MIGRATION_DATABASE_URL:-}'
      GOATFARM_MIGRATION_DATABASE_URL_FILE: '${GOATFARM_MIGRATION_DATABASE_URL_FILE:-}'
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET:-}'
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET_FILE: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET_FILE:-}'
      GOATFARM_TOTP_ENCRYPTION_KEY: '${GOATFARM_TOTP_ENCRYPTION_KEY:-}'
      GOATFARM_TOTP_ENCRYPTION_KEY_FILE: '${GOATFARM_TOTP_ENCRYPTION_KEY_FILE:-}'
      GOATFARM_METRICS_BEARER_TOKEN: '${GOATFARM_METRICS_BEARER_TOKEN:-}'
      GOATFARM_METRICS_BEARER_TOKEN_FILE: '${GOATFARM_METRICS_BEARER_TOKEN_FILE:-}'
      GOATFARM_S3_ACCESS_KEY_ID: '${GOATFARM_S3_ACCESS_KEY_ID:-}'
      GOATFARM_S3_ACCESS_KEY_ID_FILE: '${GOATFARM_S3_ACCESS_KEY_ID_FILE:-}'
      GOATFARM_S3_SECRET_ACCESS_KEY: '${GOATFARM_S3_SECRET_ACCESS_KEY:-}'
      GOATFARM_S3_SECRET_ACCESS_KEY_FILE: '${GOATFARM_S3_SECRET_ACCESS_KEY_FILE:-}'
      GOATFARM_SCREENING_ANTHROPIC_API_KEY: '${GOATFARM_SCREENING_ANTHROPIC_API_KEY:-}'
      GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE: '${GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE:-}'
      GOATFARM_SCREENING_OPENAI_API_KEY: '${GOATFARM_SCREENING_OPENAI_API_KEY:-}'
      GOATFARM_SCREENING_OPENAI_API_KEY_FILE: '${GOATFARM_SCREENING_OPENAI_API_KEY_FILE:-}'
      GOATFARM_MSG91_AUTH_KEY: '${GOATFARM_MSG91_AUTH_KEY:-}'
      GOATFARM_MSG91_AUTH_KEY_FILE: '${GOATFARM_MSG91_AUTH_KEY_FILE:-}'
      GOATFARM_WORKER_DATABASE_URL: '${GOATFARM_WORKER_DATABASE_URL:-}'
      GOATFARM_WORKER_DATABASE_URL_FILE: '${GOATFARM_WORKER_DATABASE_URL_FILE:-}'
      GOATFARM_APP_SECRET_DIR: '${GOATFARM_APP_SECRET_DIR:-}'
      GOATFARM_API_SECRET_DIR: '${GOATFARM_API_SECRET_DIR:-./secrets/api}'
      GOATFARM_MIGRATION_SECRET_DIR: '${GOATFARM_MIGRATION_SECRET_DIR:-./secrets/migration}'
      GOATFARM_WORKER_SECRET_DIR: '${GOATFARM_WORKER_SECRET_DIR:-./secrets/worker}'
    volumes:
      - type: bind
        source: '${GOATFARM_COMPOSE_ENV_FILE:?set this to the exact production --env-file path}'
        target: /run/config/compose.env
        read_only: true
        bind:
          create_host_path: false

  # The only DDL-capable process. It receives neither the API DB credential
  # nor JWT/cookie/idempotency secrets, and must complete before API/worker
  # services are allowed to start.
  migrate:
    image: '${GOATFARM_BACKEND_IMAGE_REPOSITORY:?set the backend registry repository}@${GOATFARM_BACKEND_IMAGE_DIGEST:?set its sha256 digest}'
    command: ["alembic", "upgrade", "head"]
    <<: *service-hardening
    # Read-only root filesystem: Alembic writes nothing outside the database
    # and PYTHONDONTWRITEBYTECODE=1 suppresses bytecode caches.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      config-guard:
        condition: service_completed_successfully
    environment:
      # The DDL-role URL arrives either as this plain value or from the
      # read-only mounted file named by GOATFARM_MIGRATION_DATABASE_URL_FILE
      # (2026-10-01 audit, 09-1), which keeps the inline password out of
      # docker inspect. The config-guard preflight refuses an env file that
      # sets both or neither; the app fails closed on an unusable value.
      GOATFARM_MIGRATION_DATABASE_URL: '${GOATFARM_MIGRATION_DATABASE_URL:-}'
      GOATFARM_MIGRATION_DATABASE_URL_FILE: '${GOATFARM_MIGRATION_DATABASE_URL_FILE:-}'
      GOATFARM_ENVIRONMENT: production
      GOATFARM_DB_SSLMODE: verify-full
      GOATFARM_DB_SSLROOTCERT_PATH: /run/secrets/goatfarm-postgres-ca.pem
      GOATFARM_MIGRATION_STATEMENT_TIMEOUT_MS: ${GOATFARM_MIGRATION_STATEMENT_TIMEOUT_MS:-900000}
      GOATFARM_MIGRATION_WRITES_QUIESCED: ${GOATFARM_MIGRATION_WRITES_QUIESCED:-false}
    volumes:
      - *db-ca
      - *migration-secrets
    networks:
      - goatfarm_app

  backend:
    image: '${GOATFARM_BACKEND_IMAGE_REPOSITORY:?set the backend registry repository}@${GOATFARM_BACKEND_IMAGE_DIGEST:?set its sha256 digest}'
    restart: unless-stopped
    # Process-local admission controls are supported only at one API replica.
    # The application independently holds a PostgreSQL singleton lease, so an
    # orchestrator override fails closed instead of multiplying those budgets.
    deploy:
      replicas: 1
    <<: *service-hardening
    # Read-only root filesystem: the production key mounts are read-only binds
    # and the interpreter never writes bytecode (PYTHONDONTWRITEBYTECODE=1),
    # so /tmp is the only writable surface the process needs.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 40s
    depends_on:
      config-guard:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      # Each remaining secret arrives either as its plain environment value
      # (backward compatible) or from the read-only mounted file named by its
      # *_FILE container path (2026-10-01 audit, 09-1) — the delivery the JWT
      # PEMs and database CA already use, keeping the values out of docker
      # inspect and /proc/<pid>/environ. A set file path takes precedence;
      # the config-guard preflight refuses an env file that delivers a
      # required secret by both routes or by neither.
      GOATFARM_DATABASE_URL: '${GOATFARM_DATABASE_URL:-}'
      GOATFARM_DATABASE_URL_FILE: '${GOATFARM_DATABASE_URL_FILE:-}'
      GOATFARM_ENVIRONMENT: production
      GOATFARM_DB_SSLMODE: verify-full
      GOATFARM_DB_SSLROOTCERT_PATH: /run/secrets/goatfarm-postgres-ca.pem
      GOATFARM_METRICS_ENABLED: ${GOATFARM_METRICS_ENABLED:-true}
      GOATFARM_METRICS_PUBLIC_ENABLED: "false"
      GOATFARM_METRICS_BEARER_TOKEN: '${GOATFARM_METRICS_BEARER_TOKEN:-}'
      GOATFARM_METRICS_BEARER_TOKEN_FILE: '${GOATFARM_METRICS_BEARER_TOKEN_FILE:-}'
      GOATFARM_COOKIE_SECURE: "true"
      GOATFARM_CORS_ORIGINS: '${GOATFARM_CORS_ORIGINS:?set exact public HTTPS SPA origin JSON}'
      GOATFARM_ALLOWED_HOSTS: '${GOATFARM_ALLOWED_HOSTS:?set exact public API host JSON}'
      GOATFARM_MIN_PASSWORD_LENGTH: 12
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET:-}'
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET_FILE: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET_FILE:-}'
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_PREVIOUS_SECRETS: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_PREVIOUS_SECRETS:-[]}'
      # Independent from JWT signing material so active MFA survives JWT-key
      # cutover. The previous-key ring supports a deliberate TOTP-key rotation.
      GOATFARM_TOTP_ENCRYPTION_KEY: '${GOATFARM_TOTP_ENCRYPTION_KEY:-}'
      GOATFARM_TOTP_ENCRYPTION_KEY_FILE: '${GOATFARM_TOTP_ENCRYPTION_KEY_FILE:-}'
      GOATFARM_TOTP_ENCRYPTION_PREVIOUS_KEYS: '${GOATFARM_TOTP_ENCRYPTION_PREVIOUS_KEYS:-[]}'
      GOATFARM_MAX_REQUEST_BODY_BYTES: ${GOATFARM_MAX_REQUEST_BODY_BYTES:-1048576}
      GOATFARM_MAX_REQUEST_TARGET_BYTES: ${GOATFARM_MAX_REQUEST_TARGET_BYTES:-8192}
      # By default trust only the fixed edge address below.  An outer TLS
      # terminator makes nginx append another trusted hop to X-Forwarded-For;
      # operators can extend this list with that exact peer address so Uvicorn
      # walks past the terminator and recovers the real client IP.  Do not use
      # a broad Docker subnet: every member could then spoof forwarding data.
      GOATFARM_TRUSTED_PROXY_HOSTS: '${GOATFARM_TRUSTED_PROXY_HOSTS:-${GOATFARM_EDGE_PROXY_IP:?set an unused IP inside GOATFARM_DOCKER_SUBNET}}'
      GOATFARM_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt_private.pem
      GOATFARM_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt_public.pem
      GOATFARM_JWT_PREVIOUS_PUBLIC_KEY_PATHS: '${GOATFARM_JWT_PREVIOUS_PUBLIC_KEY_PATHS:-[]}'
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_S3_ENDPOINT_URL: ${GOATFARM_S3_ENDPOINT_URL:-}
      GOATFARM_S3_REGION: ${GOATFARM_S3_REGION:-us-east-1}
      GOATFARM_S3_BUCKET: ${GOATFARM_S3_BUCKET:-}
      GOATFARM_S3_ACCESS_KEY_ID: ${GOATFARM_S3_ACCESS_KEY_ID:-}
      GOATFARM_S3_ACCESS_KEY_ID_FILE: ${GOATFARM_S3_ACCESS_KEY_ID_FILE:-}
      GOATFARM_S3_SECRET_ACCESS_KEY: ${GOATFARM_S3_SECRET_ACCESS_KEY:-}
      GOATFARM_S3_SECRET_ACCESS_KEY_FILE: ${GOATFARM_S3_SECRET_ACCESS_KEY_FILE:-}
      GOATFARM_SCREENING_S3_PREFIX: ${GOATFARM_SCREENING_S3_PREFIX:-raw}
      GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS: ${GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS:-900}
      GOATFARM_SCREENING_RAW_CLEANUP_INTERVAL_SECONDS: ${GOATFARM_SCREENING_RAW_CLEANUP_INTERVAL_SECONDS:-60}
      GOATFARM_SCREENING_RAW_CLEANUP_BATCH_SIZE: ${GOATFARM_SCREENING_RAW_CLEANUP_BATCH_SIZE:-25}
      GOATFARM_SCREENING_RAW_CLEANUP_MAX_BATCHES: ${GOATFARM_SCREENING_RAW_CLEANUP_MAX_BATCHES:-4}
      GOATFARM_SCREENING_PROVIDER: ${GOATFARM_SCREENING_PROVIDER:-anthropic}
      GOATFARM_SCREENING_PROVIDER_ROTATION: '${GOATFARM_SCREENING_PROVIDER_ROTATION:-[]}'
      GOATFARM_SCREENING_ANTHROPIC_BASE_URL: ${GOATFARM_SCREENING_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY:-}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE:-}
      GOATFARM_SCREENING_ANTHROPIC_MODEL: ${GOATFARM_SCREENING_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GOATFARM_SCREENING_OPENAI_BASE_URL: ${GOATFARM_SCREENING_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GOATFARM_SCREENING_OPENAI_API_KEY: ${GOATFARM_SCREENING_OPENAI_API_KEY:-}
      GOATFARM_SCREENING_OPENAI_API_KEY_FILE: ${GOATFARM_SCREENING_OPENAI_API_KEY_FILE:-}
      GOATFARM_SCREENING_OPENAI_MODEL: ${GOATFARM_SCREENING_OPENAI_MODEL:-gpt-5}
      GOATFARM_SCREENING_DAILY_CALL_BUDGET_PER_FARM: ${GOATFARM_SCREENING_DAILY_CALL_BUDGET_PER_FARM:-400}
      # The API runs the same boot-time screening cross-validation as the
      # worker (the horizon must cover (2 x providers + 6) x the timeout), so
      # it needs the identical pair — an operator override that reaches only
      # the worker would boot-fail the API (2026-09-28 audit, F3).
      GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS: ${GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS:-120}
      GOATFARM_SCREENING_STALE_PROCESSING_AFTER_SECONDS: ${GOATFARM_SCREENING_STALE_PROCESSING_AFTER_SECONDS:-1800}
      # Farm cap for the 20-farm owner operation (ITEM 0/8).
      GOATFARM_MAX_FARMS_PER_USER: ${GOATFARM_MAX_FARMS_PER_USER:-25}
      # Notifications (ITEM 4). Provider default is console (logs only).
      GOATFARM_NOTIFICATIONS_ENABLED: ${GOATFARM_NOTIFICATIONS_ENABLED:-false}
      GOATFARM_NOTIFICATIONS_PROVIDER: ${GOATFARM_NOTIFICATIONS_PROVIDER:-console}
      GOATFARM_MSG91_AUTH_KEY: ${GOATFARM_MSG91_AUTH_KEY:-}
      GOATFARM_MSG91_AUTH_KEY_FILE: ${GOATFARM_MSG91_AUTH_KEY_FILE:-}
      GOATFARM_MSG91_SENDER_ID: ${GOATFARM_MSG91_SENDER_ID:-HERDLY}
      GOATFARM_MSG91_TEMPLATE_ID: ${GOATFARM_MSG91_TEMPLATE_ID:-}
      GOATFARM_NOTIFICATIONS_DIGEST_HOUR: ${GOATFARM_NOTIFICATIONS_DIGEST_HOUR:-6}
      GOATFARM_NOTIFICATIONS_DIGEST_MINUTE: ${GOATFARM_NOTIFICATIONS_DIGEST_MINUTE:-30}
      GOATFARM_NOTIFICATIONS_FARM_DAILY_CAP: ${GOATFARM_NOTIFICATIONS_FARM_DAILY_CAP:-50}
      GOATFARM_NOTIFICATIONS_QUIET_START_HOUR: ${GOATFARM_NOTIFICATIONS_QUIET_START_HOUR:-21}
      GOATFARM_NOTIFICATIONS_QUIET_END_HOUR: ${GOATFARM_NOTIFICATIONS_QUIET_END_HOUR:-6}
      GOATFARM_NOTIFICATIONS_SEND_RETRY_ATTEMPTS: ${GOATFARM_NOTIFICATIONS_SEND_RETRY_ATTEMPTS:-2}
      GOATFARM_NOTIFICATIONS_SEND_RETRY_BACKOFF_SECONDS: ${GOATFARM_NOTIFICATIONS_SEND_RETRY_BACKOFF_SECONDS:-2.0}
      GOATFARM_NOTIFICATIONS_LOOP_BATCH_SIZE: ${GOATFARM_NOTIFICATIONS_LOOP_BATCH_SIZE:-100}
      GOATFARM_NOTIFICATIONS_DELIVERY_CONCURRENCY: ${GOATFARM_NOTIFICATIONS_DELIVERY_CONCURRENCY:-8}
      GOATFARM_NOTIFICATIONS_PER_FARM_DELIVERY_CONCURRENCY: ${GOATFARM_NOTIFICATIONS_PER_FARM_DELIVERY_CONCURRENCY:-2}
      # Worker tablet PIN floor: production requires the full 12-digit space.
      GOATFARM_WORKER_PIN_MIN_LENGTH: ${GOATFARM_WORKER_PIN_MIN_LENGTH:-12}
      GOATFARM_WORKER_PIN_RATE_LIMIT_MAX_ATTEMPTS: ${GOATFARM_WORKER_PIN_RATE_LIMIT_MAX_ATTEMPTS:-10}
      GOATFARM_WORKER_PIN_RATE_LIMIT_WINDOW_SECONDS: ${GOATFARM_WORKER_PIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      # Set false on deployments without shared tablets: the unauthenticated
      # worker roster is an enumeration oracle by documented design, and sites
      # that never show the tap-your-name screen can close it entirely.
      GOATFARM_WORKER_ROSTER_ENABLED: ${GOATFARM_WORKER_ROSTER_ENABLED:-false}
      # Bound each maintenance pass; the cursor resumes on the next tick.
      GOATFARM_RETENTION_SWEEP_ENABLED: ${GOATFARM_RETENTION_SWEEP_ENABLED:-true}
      GOATFARM_RETENTION_SWEEP_INTERVAL_SECONDS: ${GOATFARM_RETENTION_SWEEP_INTERVAL_SECONDS:-86400}
      GOATFARM_RETENTION_SCREENING_DAYS: ${GOATFARM_RETENTION_SCREENING_DAYS:-180}
      GOATFARM_RETENTION_SCREENING_BATCH_DAYS: ${GOATFARM_RETENTION_SCREENING_BATCH_DAYS:-365}
      GOATFARM_RETENTION_SCREENING_BUDGET_DAYS: ${GOATFARM_RETENTION_SCREENING_BUDGET_DAYS:-90}
      GOATFARM_RETENTION_NOTIFICATION_DAYS: ${GOATFARM_RETENTION_NOTIFICATION_DAYS:-400}
      GOATFARM_RETENTION_TERMINAL_TASK_DAYS: ${GOATFARM_RETENTION_TERMINAL_TASK_DAYS:-365}
      GOATFARM_RETENTION_DELETE_BATCH_SIZE: ${GOATFARM_RETENTION_DELETE_BATCH_SIZE:-500}
      GOATFARM_RETENTION_FARM_BATCH_SIZE: ${GOATFARM_RETENTION_FARM_BATCH_SIZE:-100}
      GOATFARM_RETENTION_MAX_BATCHES_PER_FARM: ${GOATFARM_RETENTION_MAX_BATCHES_PER_FARM:-4}
      GOATFARM_RETENTION_LOCK_TIMEOUT_MS: ${GOATFARM_RETENTION_LOCK_TIMEOUT_MS:-250}
      GOATFARM_RETENTION_STATEMENT_TIMEOUT_MS: ${GOATFARM_RETENTION_STATEMENT_TIMEOUT_MS:-5000}
    volumes:
      - *db-ca
      - *api-secrets
      - type: bind
        source: '${GOATFARM_JWT_SECRET_DIR:?set GOATFARM_JWT_SECRET_DIR to a read-only PEM directory}'
        target: /run/secrets/jwt
        read_only: true
    expose: ["8000"]
    networks:
      - goatfarm_app

  screening-worker:
    image: '${GOATFARM_BACKEND_IMAGE_REPOSITORY:?set the backend registry repository}@${GOATFARM_BACKEND_IMAGE_DIGEST:?set its sha256 digest}'
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    <<: *service-hardening
    # Read-only root filesystem; the health heartbeat (default
    # /tmp/goatfarm-screening-worker.json) lives on the /tmp tmpfs — keep any
    # GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH override on /tmp as well.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "screening_worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Same dual-mode secret delivery as the backend (2026-10-01 audit,
      # 09-1): a set *_FILE container path wins over the plain value; the
      # worker receives only the secrets its image-processing role needs.
      GOATFARM_DATABASE_URL: '${GOATFARM_WORKER_DATABASE_URL:-}'
      GOATFARM_DATABASE_URL_FILE: '${GOATFARM_WORKER_DATABASE_URL_FILE:-}'
      GOATFARM_ENVIRONMENT: production
      GOATFARM_DB_SSLMODE: verify-full
      GOATFARM_DB_SSLROOTCERT_PATH: /run/secrets/goatfarm-postgres-ca.pem
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_S3_ENDPOINT_URL: ${GOATFARM_S3_ENDPOINT_URL:-}
      GOATFARM_S3_REGION: ${GOATFARM_S3_REGION:-us-east-1}
      GOATFARM_S3_BUCKET: ${GOATFARM_S3_BUCKET:-}
      GOATFARM_S3_ACCESS_KEY_ID: ${GOATFARM_S3_ACCESS_KEY_ID:-}
      GOATFARM_S3_ACCESS_KEY_ID_FILE: ${GOATFARM_S3_ACCESS_KEY_ID_FILE:-}
      GOATFARM_S3_SECRET_ACCESS_KEY: ${GOATFARM_S3_SECRET_ACCESS_KEY:-}
      GOATFARM_S3_SECRET_ACCESS_KEY_FILE: ${GOATFARM_S3_SECRET_ACCESS_KEY_FILE:-}
      GOATFARM_SCREENING_S3_PREFIX: ${GOATFARM_SCREENING_S3_PREFIX:-raw}
      GOATFARM_SCREENING_POLL_INTERVAL_SECONDS: ${GOATFARM_SCREENING_POLL_INTERVAL_SECONDS:-300}
      GOATFARM_SCREENING_MAX_IMAGES_PER_CYCLE: ${GOATFARM_SCREENING_MAX_IMAGES_PER_CYCLE:-50}
      GOATFARM_SCREENING_IMAGE_MAX_EDGE_PX: ${GOATFARM_SCREENING_IMAGE_MAX_EDGE_PX:-1568}
      GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS: ${GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS:-900}
      GOATFARM_SCREENING_PROVIDER: ${GOATFARM_SCREENING_PROVIDER:-anthropic}
      GOATFARM_SCREENING_PROVIDER_ROTATION: '${GOATFARM_SCREENING_PROVIDER_ROTATION:-[]}'
      GOATFARM_SCREENING_CROP_DETECTION_ENABLED: ${GOATFARM_SCREENING_CROP_DETECTION_ENABLED:-true}
      GOATFARM_SCREENING_MAX_CROPS_PER_IMAGE: ${GOATFARM_SCREENING_MAX_CROPS_PER_IMAGE:-8}
      GOATFARM_SCREENING_ANTHROPIC_BASE_URL: ${GOATFARM_SCREENING_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY:-}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY_FILE:-}
      GOATFARM_SCREENING_ANTHROPIC_MODEL: ${GOATFARM_SCREENING_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GOATFARM_SCREENING_OPENAI_BASE_URL: ${GOATFARM_SCREENING_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GOATFARM_SCREENING_OPENAI_API_KEY: ${GOATFARM_SCREENING_OPENAI_API_KEY:-}
      GOATFARM_SCREENING_OPENAI_API_KEY_FILE: ${GOATFARM_SCREENING_OPENAI_API_KEY_FILE:-}
      GOATFARM_SCREENING_OPENAI_MODEL: ${GOATFARM_SCREENING_OPENAI_MODEL:-gpt-5}
      # The daily per-farm call budget is enforced in the worker's pipeline
      # claim path, so the worker — not just the API process — must receive it.
      GOATFARM_SCREENING_DAILY_CALL_BUDGET_PER_FARM: ${GOATFARM_SCREENING_DAILY_CALL_BUDGET_PER_FARM:-400}
      GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS: ${GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS:-120}
      # Must rise together with the timeout above: boot-time cross-validation
      # requires this horizon to cover (2 x providers + 6) x the timeout
      # (2026-09-28 audit, F3).
      GOATFARM_SCREENING_STALE_PROCESSING_AFTER_SECONDS: ${GOATFARM_SCREENING_STALE_PROCESSING_AFTER_SECONDS:-1800}
      GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH: ${GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH:-/tmp/goatfarm-screening-worker.json}
      GOATFARM_SCREENING_WORKER_HEALTH_MAX_AGE_SECONDS: ${GOATFARM_SCREENING_WORKER_HEALTH_MAX_AGE_SECONDS:-900}
      GOATFARM_SCREENING_WORKER_MAX_CONSECUTIVE_CYCLE_FAILURES: ${GOATFARM_SCREENING_WORKER_MAX_CONSECUTIVE_CYCLE_FAILURES:-3}
    volumes:
      - *db-ca
      - *worker-secrets
    networks:
      - goatfarm_app

  frontend:
    image: '${GOATFARM_FRONTEND_IMAGE_REPOSITORY:?set the frontend registry repository}@${GOATFARM_FRONTEND_IMAGE_DIGEST:?set its sha256 digest}'
    restart: unless-stopped
    <<: *service-hardening
    # Read-only root filesystem mirroring the dev stack: the standalone
    # server's only runtime writes are the incremental/image caches under
    # /app/.next/cache (size-capped tmpfs) and /tmp. The CI docker job
    # exercises /healthz and an /_next/image sharp transformation under
    # exactly these flags before an image can be published.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=128m
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Per-request nonce CSP (M-1, 2026-09-20): the frontend's proxy.ts reads
      # these deployment-owned S3/MinIO origins at runtime, so the generic
      # registry image stays deployment-neutral. Optional here and validated
      # by the edge entrypoint: a deployment with screening enabled refuses
      # to boot without them, one without screening stays empty.
      GOATFARM_CSP_IMG_ORIGINS: '${GOATFARM_CSP_IMG_ORIGINS:-}'
      GOATFARM_CSP_CONNECT_ORIGINS: '${GOATFARM_CSP_CONNECT_ORIGINS:-}'
    expose: ["3000"]
    networks:
      - goatfarm_app

  edge:
    image: '${GOATFARM_EDGE_IMAGE_REPOSITORY:?set the edge registry repository}@${GOATFARM_EDGE_IMAGE_DIGEST:?set its sha256 digest}'
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /etc/nginx/conf.d:size=1m
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/edge-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    configs:
      - source: edge_proxy
        target: /edge-proxy.template
      - source: edge_entrypoint
        target: /edge-entrypoint.sh
        mode: 0555
    environment:
      GOATFARM_ENVIRONMENT: production
      GOATFARM_EDGE_PUBLIC_SCHEME: https
      GOATFARM_EDGE_BIND_HOST: 127.0.0.1
      GOATFARM_EDGE_MAX_BODY_SIZE: ${GOATFARM_EDGE_MAX_BODY_SIZE:-1m}
      # Auth flood-zone shaping (2026-09-20 audit P2-15): the zone keys on
      # the rightmost X-Forwarded-For entry the trusted terminator appends;
      # the rate/burst are operator-tunable per deployment and validated by
      # edge-entrypoint.sh before rendering.
      GOATFARM_EDGE_AUTH_RATE: ${GOATFARM_EDGE_AUTH_RATE:-5r/s}
      GOATFARM_EDGE_AUTH_BURST: ${GOATFARM_EDGE_AUTH_BURST:-20}
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_CSP_CONNECT_ORIGINS: '${GOATFARM_CSP_CONNECT_ORIGINS:-}'
      GOATFARM_CSP_IMG_ORIGINS: '${GOATFARM_CSP_IMG_ORIGINS:-}'
    command: ["/bin/sh", "/edge-entrypoint.sh"]
    networks:
      goatfarm_app:
        ipv4_address: '${GOATFARM_EDGE_PROXY_IP:?set an unused IP inside GOATFARM_DOCKER_SUBNET}'
    # Only a trusted host TLS terminator may reach this raw HTTP listener.
    ports: ["127.0.0.1:3000:3000"]

configs:
  edge_proxy:
    file: ./docker/edge-proxy.production.conf.template
  edge_entrypoint:
    file: ./docker/edge-entrypoint.sh

networks:
  goatfarm_app:
    ipam:
      config:
        - subnet: '${GOATFARM_DOCKER_SUBNET:?set a private /24 for the production app network}'
