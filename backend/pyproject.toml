[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goatfarm-backend"
version = "2.0.0"
description = "Goat Farm Management — async JSON API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "PyJWT==2.13.0",
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "mutmut==3.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# RUF001/002/003: display strings intentionally keep en/em-dashes and '×' from the v1 UI.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Seed data tables are copied verbatim from v1; wrapping them would risk content drift.
"app/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic/versions/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Single session-scoped loop: the asyncpg engine is loop-bound and shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# --strict-markers: an undeclared @pytest.mark.<x> becomes an error, not a
# silent no-op. --strict-config: any misspelled config key fails the run.
addopts = ["--strict-markers", "--strict-config"]

[tool.mutmut]
source_paths = ["app"]
only_mutate = [
    "app/simulation/*.py",
    "app/schemas/simulation.py",
]
# Mutation workers run only deterministic, database-free tests. This keeps the
# inner loop fast and avoids parallel workers racing over the integration
# suite's shared throwaway PostgreSQL database.
pytest_add_cli_args = ["--mutation-pure"]
pytest_add_cli_args_test_selection = [
    "tests/test_simulation_advanced.py",
    "tests/test_simulation_deep_mutation.py",
    "tests/test_simulation_engine.py",
    "tests/test_simulation_explain.py",
    "tests/test_simulation_finance_mutation.py",
    "tests/test_simulation_financials.py",
    # The planner family's bodies are covered by these (sync) suites; without
    # them the deep-mutation file's thin default-arg calls would pull the
    # planner bodies into mutation scope with only weak killers.
    "tests/test_simulation_planner.py",
    "tests/test_simulation_milk_planner.py",
    "tests/test_backward_planner.py",
]
mutate_only_covered_lines = true
# mutmut excludes Python files from its generic dependency hash. Explicitly
# track the mutation harness so changed assertions cannot reuse stale verdicts.
cache_invalidation_files = ["tests/**/*.py"]
# The selected profile is deterministic and DB-free. Five times the measured
# relevant-test duration leaves ample scheduling headroom while classifying
# mutation-induced infinite loops promptly (mutmut's default is 15x).
timeout_multiplier = 5.0
timeout_constant = 1.0
# Lock/config/fixture changes can alter every mutant verdict. Prefer a slower
# sound rerun to silently reusing results produced under a different harness.
on_dependency_change = "rerun"
