[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goatfarm-backend"
version = "2.0.0"
description = "Goat Farm Management — async JSON API (FastAPI + PostgreSQL)"
license = { text = "Proprietary" }
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "PyJWT==2.15.1",
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
    "prometheus-client==0.26.0",
    # Screening storage, image normalization, and vision-provider HTTP calls.
    "boto3==1.40.11",
    # Pin the image decoder directly because it handles untrusted uploads.
    "Pillow==12.3.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260906",
    "asyncpg-stubs==0.31.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
    # Simplification, consistent returns, pathlib, and selected security checks.
    "C4",
    "SIM",
    "RET",
    "PTH",
    "S101",
    "S602",
    "S608",
]
ignore = [
    # UI text intentionally includes typographic dashes and multiplication signs.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Seed data tables are copied verbatim from v1; wrapping them would risk content drift.
"app/seed.py" = ["E501"]
# Tests use assertions and deliberately exercise literal database DDL.
"tests/**" = ["S101", "S608"]
# Alembic revisions are raw DDL by design.
"alembic/versions/**" = ["S608"]
# Operator scripts build controlled database administration statements.
"scripts/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic/versions/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# boto3/botocore ship no type stubs (boto3-stubs would pull per-service
# packages for one client). The s3 wrapper confines every untyped call and
# casts at the boundary.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Single session-scoped loop: the asyncpg engine is loop-bound and shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# --strict-markers: an undeclared @pytest.mark.<x> becomes an error, not a
# silent no-op. --strict-config: any misspelled config key fails the run.
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
# AsyncSession switches through greenlet; trace both greenlet and thread work.
concurrency = ["greenlet", "thread"]
# Enforce branch coverage so untested failure paths affect the coverage gate.
branch = true

[tool.coverage.report]
# pytest-cov enforces this combined line-and-branch floor locally and in CI.
# Raise it as measured coverage improves; do not retry a regression into passing.
fail_under = 92
