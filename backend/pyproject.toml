[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goatfarm-backend"
version = "2.0.0"
description = "Goat Farm Management — async JSON API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "PyJWT==2.13.0",
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# RUF001/002/003: display strings intentionally keep en/em-dashes and '×' from the v1 UI.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Seed data tables are copied verbatim from v1; wrapping them would risk content drift.
"app/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic/versions/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Single session-scoped loop: the asyncpg engine is loop-bound and shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
