[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goatfarm-backend"
version = "2.0.0"
description = "Goat Farm Management — async JSON API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "PyJWT==2.13.0",
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
    "prometheus-client==0.26.0",
    # Disease-screening worker: S3 access (sync boto3, wrapped in threads),
    # image normalization, and outbound vision-model calls (httpx moves from
    # dev-only to runtime: production provider traffic now depends on it).
    "boto3==1.40.11",
    # User-provided screening photos reach Pillow's native decoders. Keep the
    # pinned release on the current patched line rather than relying on a
    # transitive resolver upgrade.
    "Pillow==12.3.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
    # ITEM 10 (2026-09-21 playbook): audit-time breadth, adopted after
    # triage. C4 = comprehension simplification, SIM = small simplifications,
    # RET = consistent returns, PTH = pathlib over os.path, and the S rules
    # that matter here (S101 asserts outside tests, S602 shell injection,
    # S608 SQL string building in app code).
    "C4",
    "SIM",
    "RET",
    "PTH",
    "S101",
    "S602",
    "S608",
]
ignore = [
    # S105/S106 (hardcoded password name heuristics): every hit is a
    # scope-name/reason-string CONSTANT (e.g. TEAM_PASSWORD_RESERVATION_SCOPE)
    # — real secrets are env-driven with fail-closed validators, and the
    # frontend's adversarial literal scan covers shipped-source secrets.
    # S311: `random.Random` is deliberate everywhere (seeded, reproducible
    # simulations); nothing security-sensitive uses it.
    # S603/S607: subprocess calls with fixed argv through PATH — shell=True
    # (S602) stays enabled, which is the actual injection boundary.
    "S105",
    "S106",
    "S311",
    "S603",
    "S607",
    # RUF001/002/003: display strings intentionally keep en/em-dashes and
    # '×' from the v1 UI.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Seed data tables are copied verbatim from v1; wrapping them would risk content drift.
"app/seed.py" = ["E501"]
# Tests: assert IS the assertion API; fixture passwords/keys are throwaway by
# definition; S608 flags the literal SQL the DB layer tests deliberately run.
"tests/**" = ["S101", "S608"]
# Alembic revisions are raw DDL by design.
"alembic/versions/**" = ["S608"]
# Operator scripts: document-shell subprocess calls with fixed argv.
"scripts/**" = ["S603", "S607", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic/versions/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# boto3/botocore ship no type stubs (boto3-stubs would pull per-service
# packages for one client). The s3 wrapper confines every untyped call and
# casts at the boundary.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Single session-scoped loop: the asyncpg engine is loop-bound and shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# --strict-markers: an undeclared @pytest.mark.<x> becomes an error, not a
# silent no-op. --strict-config: any misspelled config key fails the run.
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
# SQLAlchemy's AsyncSession bridges async/sync through greenlet: under the
# default tracer, line events after each greenlet switch are silently lost,
# which under-reported exactly the service-layer modules the tests drive the
# hardest (services/kidding.py measured 23% app-wide while its suite plainly
# exercised it — verified with a probe line). greenlet-aware tracing fixes
# the attribution; the measured app-wide number only goes up, so the 75%
# ratchet below stays honest.
concurrency = ["greenlet", "thread"]
# Line coverage can report a fully covered conditional while one safety branch
# (often the failure path) was never exercised. Keep the backend ratchet on
# branch coverage too; CI passes --cov-branch explicitly for clarity.
branch = true

[tool.coverage.report]
# Coverage ratchet floor for `pytest --cov=app --cov-branch` (ci.yml). Single-sourced here
# so pytest-cov enforces the same floor for local instrumented runs as for CI
# (the flag --cov-fail-under would override, not complement, this value).
# Keep it at or below the measured app-wide coverage on main — raise it as
# coverage improves, never above the measured value.
# B7 (2026-09-21 audit): with branch = true coverage.py's headline TOTAL is
# the COMBINED line+branch metric (~92.7% measured on main), not the branch
# figure alone — the old 85 evaluated the combined number while its comment
# claimed a branch floor, so the ratchet was ~8 points weaker than
# documented. 92 sits just under the measured combined figure so ordinary
# fluctuation does not fail CI while a real regression still trips the floor.
fail_under = 92
