# Per-domain mutmut profile: health & feeding.
#
# Scope: health-event validation, vaccine/withdrawal cadence and the feeding
# plan/recipe arithmetic. Like every domain profile it is DB-free
# (--mutation-pure); the cross-farm and workflow integration cases stay in
# ci.pyproject's real-PostgreSQL job.
source_paths = ["app"]
only_mutate = [
    "app/services/health.py",
    "app/services/feeding.py",
    "app/services/cadence.py",
]
pytest_add_cli_args = ["--mutation-pure"]
pytest_add_cli_args_test_selection = [
    "tests/test_health_extended.py",
    "tests/test_health_bugs.py",
    "tests/test_feeding_extended.py",
    "tests/test_unit_extended.py",
]
mutate_only_covered_lines = true
cache_invalidation_files = ["tests/**/*.py"]
timeout_multiplier = 5.0
timeout_constant = 1.0
on_dependency_change = "rerun"
