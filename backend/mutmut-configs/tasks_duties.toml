# Per-domain mutmut profile: tasks & duties.
#
# Scope: duty scheduling/supersession, the verification state machine and
# the auto-generated task calendar (quarantine protocol, weaning duties).
source_paths = ["app"]
only_mutate = [
    "app/services/tasks.py",
    "app/services/cadence.py",
]
pytest_add_cli_args = ["--mutation-pure"]
pytest_add_cli_args_test_selection = [
    "tests/test_tasks_extended.py",
    "tests/test_tasks_bugs.py",
    "tests/test_ops.py",
    "tests/test_unit_bugs.py",
]
mutate_only_covered_lines = true
cache_invalidation_files = ["tests/**/*.py"]
timeout_multiplier = 5.0
timeout_constant = 1.0
on_dependency_change = "rerun"
