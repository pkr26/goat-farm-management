# Extend Gitleaks' default rules. Idempotency-Key test fixtures are request
# identifiers; the backend stores their HMAC digest, not a credential.

[extend]
useDefault = true

# Requires Gitleaks >= 8.21 for the [[allowlists]] syntax.
[[allowlists]]
description = "Idempotency-Key header values are request identifiers, never secrets"
regexTarget = "line"
regexes = [
  '''(?i)["']?idempotency-key["']?\s*[:=]\s*["'][^"']+["']''',
]
