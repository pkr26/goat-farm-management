# Local-development stack: Postgres + migration job + API + frontend,
# published through one edge proxy so the SPA and the API share an origin. The
# bundled Postgres deliberately has no TLS keys or CA material, so this file
# refuses GOATFARM_ENVIRONMENT=production. Deploy production against an
# externally managed, verify-full PostgreSQL endpoint instead (README).
# Single backend replica on purpose — the auth rate limiter is in-memory and
# the container CMD hard-codes --workers 1.
# Credentials come from .env (copy .env.example to .env for local defaults).
# API and migration URLs are supplied whole: Compose must not concatenate raw
# usernames/passwords into URLs because reserved characters would change how
# SQLAlchemy parses the credential.
#
# Every service runs with no-new-privileges, drops all capabilities by default,
# carries an explicit memory/CPU limit, and rotates its json-file logs via the
# anchor below (without it the daemon's default grows logs unboundedly).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Compose normally drops a misspelt root-.env knob because only variables
  # named below are interpolated. Validate that exact file before the
  # migration job can reach the database, rather than relying on an API
  # process that would never see the typo.
  config-guard:
    build: .
    command: ["python", "scripts/compose_env_guard.py", "/run/config/compose.env"]
    restart: "no"
    read_only: true
    healthcheck:
      disable: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    volumes:
      # Compose interpolates from the file passed to --env-file (default
      # ./.env). Honoring an explicit GOATFARM_COMPOSE_ENV_FILE there keeps
      # the guard validating the same file that drove interpolation instead
      # of silently re-reading ./.env (the production file requires the same
      # variable; it is allowlisted in NON_APP_ENV_VARS).
      - type: bind
        source: ${GOATFARM_COMPOSE_ENV_FILE:-.env}
        target: /run/config/compose.env
        read_only: true
        bind:
          create_host_path: false

  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    # Least privilege: the official image's bootstrap needs exactly these
    # capabilities — CHOWN/DAC_OVERRIDE/FSETID for initdb on the data volume,
    # SETGID/SETUID to drop from root to the postgres user — and nothing else.
    # no-new-privileges keeps that drop one-way.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FSETID", "SETGID", "SETUID"]
    mem_limit: 1g
    cpus: 2.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goatfarm}
      POSTGRES_USER: ${POSTGRES_USER:-goatfarm}
      # :? — Compose refuses to start without a real secret; a copy-paste
      # deployment must not silently run Postgres on a known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Expand the already-injected container variables at runtime and quote
      # them, rather than splicing raw .env values into a shell command.
      # The official image's initdb bootstrap server listens on a Unix socket
      # before the real TCP server starts. Probe TCP explicitly so migrations
      # cannot race that socket-only bootstrap phase.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    # RT-R-2: the database is reachable only from the backend and the
    # migration job — never from the frontend or the edge.
    networks:
      - goatfarm_data

  migrate:
    build: .
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$GOATFARM_ENVIRONMENT" = "production" ]; then
          echo "The bundled docker-compose PostgreSQL service is development-only and has no authenticated TLS topology. Use the documented external verify-full PostgreSQL production deployment." >&2
          exit 2
        fi
        exec alembic upgrade head
    # One-shot DDL job running as the image's non-root user: no capabilities,
    # no privilege escalation path. Read-only root filesystem: Alembic writes
    # nothing outside the database, and PYTHONDONTWRITEBYTECODE=1 means the
    # interpreter never writes bytecode caches.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    depends_on:
      config-guard:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      # Deliberately do not expose the long-running API credential to this
      # one-shot DDL job. Production should give this URL a migrator identity.
      GOATFARM_MIGRATION_DATABASE_URL: '${GOATFARM_MIGRATION_DATABASE_URL:?copy .env.example to .env and set the full migration URL}'
      # Alembic consumes a migration-only settings projection: this enables
      # the production verify-full gate without injecting API cookie/JWT/HMAC
      # configuration into the privileged one-shot container.
      # Mandatory interpolation closes the dangerous root-.env typo path:
      # GOATFARM_ENVIRONMNET=production must not quietly select development.
      GOATFARM_ENVIRONMENT: '${GOATFARM_ENVIRONMENT:?set GOATFARM_ENVIRONMENT explicitly (development or production)}'
      GOATFARM_DB_SSLMODE: '${GOATFARM_DB_SSLMODE:?set GOATFARM_DB_SSLMODE explicitly (disable for local development)}'
    networks:
      - goatfarm_data

  backend:
    build: .
    restart: unless-stopped
    # The API serves as a non-root user and needs no Linux capabilities. The
    # root filesystem is read-only: PYTHONDONTWRITEBYTECODE=1 (Dockerfile ENV)
    # means the interpreter never writes bytecode — the old justification for
    # a writable FS is gone — and every legitimate runtime write (the
    # dev-keypair tempfile inside the jwtkeys volume) already targets a volume
    # or /tmp. The 2g ceiling leaves headroom for the simulation engine's
    # Monte Carlo runs.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging
    # Uvicorn drains in-flight requests for up to 30 seconds (Dockerfile CMD).
    # Compose otherwise sends SIGKILL after its 10-second default.
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # This process receives only the DDL-free application identity.
      GOATFARM_DATABASE_URL: '${GOATFARM_DATABASE_URL:?copy .env.example to .env and set the full API URL}'
      GOATFARM_DB_SSLMODE: '${GOATFARM_DB_SSLMODE:?set GOATFARM_DB_SSLMODE explicitly (disable for local development)}'
      # This bundled stack is deliberately local-only; the migration job
      # refuses production because its database is TLS-off. A real deployment
      # uses the external TLS topology documented in README.
      GOATFARM_ENVIRONMENT: '${GOATFARM_ENVIRONMENT:?set GOATFARM_ENVIRONMENT explicitly (development or production)}'
      GOATFARM_COOKIE_SECURE: ${GOATFARM_COOKIE_SECURE:-false}
      GOATFARM_CORS_ORIGINS: '${GOATFARM_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      # The edge forwards the browser's Host. Next's server-side rewrite still
      # uses changeOrigin and sends Host: backend:8000, so keep the exact
      # internal service name in every override as well as public hosts.
      GOATFARM_ALLOWED_HOSTS: '${GOATFARM_ALLOWED_HOSTS:-["localhost","127.0.0.1","test","testserver","backend"]}'
      GOATFARM_MIN_PASSWORD_LENGTH: ${GOATFARM_MIN_PASSWORD_LENGTH:-8}
      # No compose fallback default: the backend config applies the identical
      # development default itself, and its production gate rejects that known
      # value fail-closed — a compose-level fallback would only blur which
      # layer supplied the secret. Production must set a real secret.
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET: ${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_SECRET:?set a stable idempotency HMAC secret (required — see .env.example)}
      GOATFARM_IDEMPOTENCY_REQUEST_HMAC_PREVIOUS_SECRETS: '${GOATFARM_IDEMPOTENCY_REQUEST_HMAC_PREVIOUS_SECRETS:-[]}'
      # Optional in the local legacy-compatible topology. An empty value is
      # interpreted as unset by Settings; production Compose requires a real
      # independent key in docker-compose.production.yml.
      GOATFARM_TOTP_ENCRYPTION_KEY: '${GOATFARM_TOTP_ENCRYPTION_KEY:-}'
      GOATFARM_TOTP_ENCRYPTION_PREVIOUS_KEYS: '${GOATFARM_TOTP_ENCRYPTION_PREVIOUS_KEYS:-[]}'
      GOATFARM_MAX_REQUEST_BODY_BYTES: ${GOATFARM_MAX_REQUEST_BODY_BYTES:-1048576}
      GOATFARM_MAX_REQUEST_TARGET_BYTES: ${GOATFARM_MAX_REQUEST_TARGET_BYTES:-8192}
      # Set false to close the unauthenticated worker roster (enumeration
      # oracle by documented design) on deployments without shared tablets.
      GOATFARM_WORKER_ROSTER_ENABLED: ${GOATFARM_WORKER_ROSTER_ENABLED:-true}
      # Defaults to exactly the edge container's configurable address (see the
      # `goatfarm_app` network below) — never the whole bridge range, which would
      # also cover other containers and let them spoof X-Forwarded-For. The
      # explicit GOATFARM_TRUSTED_PROXY_HOSTS override (README) still wins so
      # topologies with an additional outer proxy/load balancer can trust its
      # address too; dropping that override silently collapsed every client
      # onto one IP for the per-IP auth ceilings behind such deployments.
      GOATFARM_TRUSTED_PROXY_HOSTS: ${GOATFARM_TRUSTED_PROXY_HOSTS:-${GOATFARM_EDGE_PROXY_IP:-198.18.243.10}}
      GOATFARM_JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      GOATFARM_JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      # Forward the documented verification-only keyring too; deployments
      # mounting additional public keys can rotate JWTs without a Compose edit.
      GOATFARM_JWT_PREVIOUS_PUBLIC_KEY_PATHS: '${GOATFARM_JWT_PREVIOUS_PUBLIC_KEY_PATHS:-[]}'
      # Screening's API half runs in this process too: it mints presigned
      # upload/display URLs (SigV4-local, but it needs the S3 credentials)
      # and must pass the same fail-closed config validation as the worker
      # when GOATFARM_SCREENING_ENABLED=true. Without this block the worker
      # would screen photos the review UI could never display and the
      # walkthrough could never upload.
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_S3_ENDPOINT_URL: ${GOATFARM_S3_ENDPOINT_URL:-}
      GOATFARM_S3_REGION: ${GOATFARM_S3_REGION:-us-east-1}
      GOATFARM_S3_BUCKET: ${GOATFARM_S3_BUCKET:-}
      GOATFARM_S3_ACCESS_KEY_ID: ${GOATFARM_S3_ACCESS_KEY_ID:-}
      GOATFARM_S3_SECRET_ACCESS_KEY: ${GOATFARM_S3_SECRET_ACCESS_KEY:-}
      GOATFARM_SCREENING_S3_PREFIX: ${GOATFARM_SCREENING_S3_PREFIX:-raw}
      GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS: ${GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS:-900}
      GOATFARM_SCREENING_PROVIDER: ${GOATFARM_SCREENING_PROVIDER:-anthropic}
      GOATFARM_SCREENING_PROVIDER_ROTATION: '${GOATFARM_SCREENING_PROVIDER_ROTATION:-[]}'
      GOATFARM_SCREENING_ANTHROPIC_BASE_URL: ${GOATFARM_SCREENING_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY:-}
      GOATFARM_SCREENING_ANTHROPIC_MODEL: ${GOATFARM_SCREENING_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GOATFARM_SCREENING_OPENAI_BASE_URL: ${GOATFARM_SCREENING_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GOATFARM_SCREENING_OPENAI_API_KEY: ${GOATFARM_SCREENING_OPENAI_API_KEY:-}
      GOATFARM_SCREENING_OPENAI_MODEL: ${GOATFARM_SCREENING_OPENAI_MODEL:-gpt-5}
    volumes:
      - jwtkeys:/app/keys
    # Internal only: the edge below is the sole host-published listener.
    expose:
      - "8000"
    # RT-R-2: straddles both segments — it must reach the database and serve
    # the edge/frontend; nothing else crosses.
    networks:
      - goatfarm_app
      - goatfarm_data

  # Disease-screening worker: same image as the API, different entrypoint.
  # Polls the S3 bucket (GOATFARM_SCREENING_S3_PREFIX) and drives the gate
  # model pipeline. Idles harmlessly while GOATFARM_SCREENING_ENABLED is
  # false, so the service can ship in every environment.
  screening-worker:
    build: .
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Read-only root filesystem; the health heartbeat (default
    # /tmp/goatfarm-screening-worker.json) lives on the /tmp tmpfs — keep any
    # GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH override on /tmp as well.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # Image normalization is the memory high-water mark: Pillow decodes one
    # HD photo at a time inside a bounded per-cycle batch.
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    stop_grace_period: 40s
    healthcheck:
      # Process liveness is insufficient: a bad S3/provider configuration can
      # leave the Python loop alive while every screening cycle fails. The
      # worker's atomic heartbeat records a successful cycle (or expected
      # disabled state), and this probe turns a stale/error state unhealthy.
      test: ["CMD", "python", "screening_worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOATFARM_DATABASE_URL: '${GOATFARM_DATABASE_URL:?copy .env.example to .env and set the full API URL}'
      GOATFARM_DB_SSLMODE: '${GOATFARM_DB_SSLMODE:?set GOATFARM_DB_SSLMODE explicitly (disable for local development)}'
      GOATFARM_ENVIRONMENT: '${GOATFARM_ENVIRONMENT:?set GOATFARM_ENVIRONMENT explicitly (development or production)}'
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_S3_ENDPOINT_URL: ${GOATFARM_S3_ENDPOINT_URL:-}
      GOATFARM_S3_REGION: ${GOATFARM_S3_REGION:-us-east-1}
      GOATFARM_S3_BUCKET: ${GOATFARM_S3_BUCKET:-}
      GOATFARM_S3_ACCESS_KEY_ID: ${GOATFARM_S3_ACCESS_KEY_ID:-}
      GOATFARM_S3_SECRET_ACCESS_KEY: ${GOATFARM_S3_SECRET_ACCESS_KEY:-}
      GOATFARM_SCREENING_S3_PREFIX: ${GOATFARM_SCREENING_S3_PREFIX:-raw}
      GOATFARM_SCREENING_POLL_INTERVAL_SECONDS: ${GOATFARM_SCREENING_POLL_INTERVAL_SECONDS:-300}
      GOATFARM_SCREENING_MAX_IMAGES_PER_CYCLE: ${GOATFARM_SCREENING_MAX_IMAGES_PER_CYCLE:-50}
      GOATFARM_SCREENING_IMAGE_MAX_EDGE_PX: ${GOATFARM_SCREENING_IMAGE_MAX_EDGE_PX:-1568}
      GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS: ${GOATFARM_SCREENING_PRESIGN_EXPIRY_SECONDS:-900}
      GOATFARM_SCREENING_PROVIDER: ${GOATFARM_SCREENING_PROVIDER:-anthropic}
      GOATFARM_SCREENING_PROVIDER_ROTATION: '${GOATFARM_SCREENING_PROVIDER_ROTATION:-[]}'
      GOATFARM_SCREENING_CROP_DETECTION_ENABLED: ${GOATFARM_SCREENING_CROP_DETECTION_ENABLED:-true}
      GOATFARM_SCREENING_MAX_CROPS_PER_IMAGE: ${GOATFARM_SCREENING_MAX_CROPS_PER_IMAGE:-8}
      GOATFARM_SCREENING_ANTHROPIC_BASE_URL: ${GOATFARM_SCREENING_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GOATFARM_SCREENING_ANTHROPIC_API_KEY: ${GOATFARM_SCREENING_ANTHROPIC_API_KEY:-}
      GOATFARM_SCREENING_ANTHROPIC_MODEL: ${GOATFARM_SCREENING_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      GOATFARM_SCREENING_OPENAI_BASE_URL: ${GOATFARM_SCREENING_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GOATFARM_SCREENING_OPENAI_API_KEY: ${GOATFARM_SCREENING_OPENAI_API_KEY:-}
      GOATFARM_SCREENING_OPENAI_MODEL: ${GOATFARM_SCREENING_OPENAI_MODEL:-gpt-5}
      GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS: ${GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS:-120}
      GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH: ${GOATFARM_SCREENING_WORKER_HEARTBEAT_PATH:-/tmp/goatfarm-screening-worker.json}
      GOATFARM_SCREENING_WORKER_HEALTH_MAX_AGE_SECONDS: ${GOATFARM_SCREENING_WORKER_HEALTH_MAX_AGE_SECONDS:-900}
      GOATFARM_SCREENING_WORKER_MAX_CONSECUTIVE_CYCLE_FAILURES: ${GOATFARM_SCREENING_WORKER_MAX_CONSECUTIVE_CYCLE_FAILURES:-3}
    command: ["python", "-m", "app.worker"]
    networks:
      - goatfarm_data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    # Next standalone server as its own non-root user: no capabilities needed.
    # Read-only root filesystem: the standalone server's only runtime writes
    # are the incremental/image caches under /app/.next/cache (kept on a
    # size-capped tmpfs) and /tmp. CI's docker job exercises /healthz AND an
    # /_next/image sharp transformation under exactly these flags before an
    # image can land on main.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=128m
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Per-request nonce CSP (M-1, 2026-09-20): the frontend's proxy.ts reads
      # these deployment-owned S3/MinIO origins at runtime, so the generic
      # image stays deployment-neutral. The edge entrypoint validates the same
      # values at boot; enable screening and the guard refuses to start
      # without them.
      GOATFARM_CSP_IMG_ORIGINS: '${GOATFARM_CSP_IMG_ORIGINS:-}'
      GOATFARM_CSP_CONNECT_ORIGINS: '${GOATFARM_CSP_CONNECT_ORIGINS:-}'
    # Not published: the edge below is the single public entry. Browser /api
    # traffic must not transit Next's rewrite, whose proxy never emits
    # X-Forwarded-For (it sets only x-forwarded-host), so the API would see
    # the Next container's address for every client on the planet.
    expose:
      - "3000"
    networks:
      - goatfarm_app

  edge:
    image: nginx:1.30-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    # Read-only root filesystem: nginx writes only its temp dirs and pid file,
    # both redirected to size-capped tmpfs. The official image's master runs as
    # root with `user nginx;`: it chowns the freshly-created temp dirs to uid
    # 101 at startup and every worker then setgid/setuid(101) — both fatal on
    # failure — so after dropping ALL it still needs exactly those three
    # capabilities (port 3000 is unprivileged, so NET_BIND_SERVICE is not among
    # them). no-new-privileges keeps the worker drop one-way.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    read_only: true
    tmpfs:
      # client/proxy body buffers; 1m bodies cannot approach the cap.
      - /var/cache/nginx:size=64m
      # nginx.pid (Alpine symlinks /var/run -> /run).
      - /var/run:size=1m
      # The validated runtime CSP template is rendered here before nginx
      # starts. Keeping it on tmpfs preserves the read-only root filesystem.
      - /etc/nginx/conf.d:size=1m
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      # /edge-healthz is answered by nginx itself (see the config below) so
      # this asserts the proxy is alive without coupling its status to either
      # upstream being up.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/edge-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    configs:
      - source: edge_proxy
        target: /edge-proxy.template
      - source: edge_entrypoint
        target: /edge-entrypoint.sh
        mode: 0555
    environment:
      # The edge is deliberately HTTP-only.  In production it must be behind
      # a TLS terminator, whose fixed scheme is propagated below.  Fail before
      # serving if an operator selects production but leaves that assertion at
      # HTTP; a Secure refresh cookie alone cannot protect bearer responses.
      GOATFARM_ENVIRONMENT: '${GOATFARM_ENVIRONMENT:?set GOATFARM_ENVIRONMENT explicitly (development or production)}'
      GOATFARM_EDGE_PUBLIC_SCHEME: ${GOATFARM_EDGE_PUBLIC_SCHEME:-http}
      # The bind-host guard below must see the same value the ports mapping
      # interpolated; without this entry the in-container default silently
      # reads loopback and the public-bind warning can never fire.
      GOATFARM_EDGE_BIND_HOST: ${GOATFARM_EDGE_BIND_HOST:-127.0.0.1}
      # Keep every config value substituted by edge-entrypoint.sh in the
      # container environment. Rendering this directly through Compose would
      # bypass the runtime syntax validator on a malformed size value.
      GOATFARM_EDGE_MAX_BODY_SIZE: ${GOATFARM_EDGE_MAX_BODY_SIZE:-1m}
      # Auth flood-zone shaping (2026-09-20 audit P2-15): the rate/burst the
      # edge applies to /api/auth/*, grammar-validated by edge-entrypoint.sh
      # before rendering.
      GOATFARM_EDGE_AUTH_RATE: ${GOATFARM_EDGE_AUTH_RATE:-5r/s}
      GOATFARM_EDGE_AUTH_BURST: ${GOATFARM_EDGE_AUTH_BURST:-20}
      # Runtime, validated CSP additions for browser-direct S3 POST/GET
      # traffic. Generic registry frontend images intentionally do not bake
      # deployment-specific origins; edge-entrypoint.sh renders these values
      # into the header after strict validation.
      GOATFARM_SCREENING_ENABLED: ${GOATFARM_SCREENING_ENABLED:-false}
      GOATFARM_CSP_CONNECT_ORIGINS: '${GOATFARM_CSP_CONNECT_ORIGINS:-}'
      GOATFARM_CSP_IMG_ORIGINS: '${GOATFARM_CSP_IMG_ORIGINS:-}'
    command: ["/bin/sh", "/edge-entrypoint.sh"]
    networks:
      goatfarm_app:
        # Fixed within an operator-selectable subnet so the backend can trust
        # this one peer without pinning every deployment to a collision-prone
        # Docker/AWS range.
        ipv4_address: ${GOATFARM_EDGE_PROXY_IP:-198.18.243.10}
    ports:
      # Local development remains http://localhost:3000. A production TLS
      # terminator on this host can proxy to the same loopback listener; a
      # containerized terminator can use edge:3000 on the Compose network.
      - "${GOATFARM_EDGE_BIND_HOST:-127.0.0.1}:3000:3000"

configs:
  edge_proxy:
    # A file-based config, like the production manifest: file contents are
    # not Compose-interpolated, so the template carries literal nginx `$`
    # variables (no `$$` escaping), and read-only services require the
    # `file` form (Compose rejects inline `content` there). The CSP
    # placeholders are rendered only by edge-entrypoint.sh after it
    # validates the runtime source lists; Compose never splices them into
    # nginx syntax directly.
    file: ./docker/edge-proxy.dev.conf.template
  edge_entrypoint:
    file: ./docker/edge-entrypoint.sh
networks:
  # RT-R-2: two segments instead of one flat bridge. The edge and frontend
  # can no longer reach `db:5432`; only the backend (and the migration job)
  # straddle both. The edge keeps its fixed app-segment address so
  # GOATFARM_TRUSTED_PROXY_HOSTS keeps pinning exactly one peer.
  goatfarm_app:
    ipam:
      config:
        - subnet: ${GOATFARM_DOCKER_SUBNET:-198.18.243.0/24}
  goatfarm_data:
    ipam:
      config:
        - subnet: ${GOATFARM_DOCKER_DATA_SUBNET:-198.18.244.0/24}

volumes:
  pgdata:
  jwtkeys:
