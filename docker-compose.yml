# Optional local/self-hosted stack: Postgres + backend (builds ./Dockerfile).
# Single backend replica on purpose — the auth rate limiter is in-memory.
# The frontend is served separately (Next.js), see frontend/README or `pnpm dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: goatfarm
      POSTGRES_USER: goatfarm
      POSTGRES_PASSWORD: goatfarm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goatfarm -d goatfarm"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOATFARM_DATABASE_URL: postgresql+asyncpg://goatfarm:goatfarm@db:5432/goatfarm
      # Local stack on plain HTTP: stays "development". A real deployment sets
      # GOATFARM_ENVIRONMENT=production + GOATFARM_COOKIE_SECURE=true +
      # non-localhost GOATFARM_CORS_ORIGINS (validated fail-closed at boot).
      GOATFARM_ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  pgdata:
