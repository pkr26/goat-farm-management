# Optional local/self-hosted stack: Postgres + backend (builds ./Dockerfile).
# Single backend replica on purpose — the auth rate limiter is in-memory and
# the container CMD hard-codes --workers 1.
# The frontend is served separately (Next.js), see frontend/README or `pnpm dev`.
# Credentials come from .env (copy .env.example to .env for defaults).
services:
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goatfarm}
      POSTGRES_USER: ${POSTGRES_USER:-goatfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goatfarm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goatfarm} -d ${POSTGRES_DB:-goatfarm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOATFARM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goatfarm}:${POSTGRES_PASSWORD:-goatfarm}@db:5432/${POSTGRES_DB:-goatfarm}
      # Local stack on plain HTTP: stays "development". A real deployment sets
      # GOATFARM_ENVIRONMENT=production + GOATFARM_COOKIE_SECURE=true +
      # non-localhost GOATFARM_CORS_ORIGINS + GOATFARM_DB_SSLMODE=require
      # + GOATFARM_MIN_PASSWORD_LENGTH=12 and stable mounted JWT keys
      # (validated fail-closed at boot).
      GOATFARM_ENVIRONMENT: ${GOATFARM_ENVIRONMENT:-development}
      GOATFARM_JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      GOATFARM_JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
    volumes:
      - jwtkeys:/app/keys
    ports:
      - "8000:8000"

volumes:
  pgdata:
  jwtkeys:
