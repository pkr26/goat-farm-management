name: Frontend mutation testing

# Weekly scheduled Stryker campaign over the four frontend shards
# (app1 / app2 / components / lib — see frontend/stryker.*.config.mjs).
# Mirrors the backend mutmut posture: a campaign is far too slow to sit on a
# PR, so this NEVER runs on pull requests; survivors are triaged by hand from
# the uploaded artifacts and the trend file, not gated (2026-09-20 audit
# P1-11: the shards existed as config but nothing invoked them, and the lib
# shard's .ts-only glob excluded auth-context.tsx / i18n/index.tsx).
on:
  schedule:
    - cron: "43 2 * * 2"
  workflow_dispatch:

concurrency:
  group: frontend-mutation-${{ github.workflow }}
  # A superseded scheduled run is worthless; keep at most one campaign.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    name: stryker (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [app1, app2, components, lib]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-mutation-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-mutation-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Stryker shard
        working-directory: frontend
        run: |
          status=0
          timeout --signal=TERM --kill-after=60 20000 \
            pnpm exec stryker run "stryker.${{ matrix.shard }}.config.mjs" --concurrency 4 || status=$?
          echo "stryker exit code: ${status} (124 = campaign window exhausted)"
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::warning::stryker exited ${status} — the campaign did not complete. Inspect the job log and the results artifact."
          fi

      - name: Collect score row
        # One machine-readable line per shard; the trend job below aggregates
        # them into audit_reports/mutation-trend.json.
        if: always()
        working-directory: frontend
        run: |
          report="reports/mutation/${{ matrix.shard }}.json"
          if [ -f "$report" ]; then
            node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const t = r.total ?? {};
              const killed = (t.killed ?? 0) + (t.timeout ?? 0);
              const total = killed + (t.survived ?? 0) + (t.noCoverage ?? 0) + (t.compileError ?? 0) + (t.runtimeError ?? 0) + (t.ignored ?? 0);
              const score = total ? (100.0 * killed / total) : 0.0;
              console.log(`frontend_${process.argv[2]} killed=${killed} survived=${t.survived ?? 0} total=${total} score=${score.toFixed(1)}`);
            ' "$report" "${{ matrix.shard }}" > shard-score.txt
          else
            echo "frontend_${{ matrix.shard }} no-stats" > shard-score.txt
          fi
          cat shard-score.txt

      - name: Upload Stryker artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-results-${{ matrix.shard }}
          path: |
            frontend/shard-score.txt
            frontend/reports/mutation/${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 90

  trend:
    name: Publish frontend mutation score trend
    needs: stryker
    # Append this week's per-shard scores to the same trend file the backend
    # campaign writes (frontend_* domain names). Skips on failed weeks rather
    # than recording an incomplete row.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}

      - name: Download all shard score rows
        uses: actions/download-artifact@d3f86a106a0bac45b974a6cc818681fe38274446 # v4
        with:
          pattern: stryker-results-*
          merge-multiple: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Append score rows to the trend file
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rows = []
          for f in Path(".").glob("shard-score.txt"):
              for line in f.read_text().splitlines():
                  parts = line.split()
                  if len(parts) < 2 or parts[1] == "no-stats":
                      continue
                  row = {"domain": parts[0]}
                  for kv in parts[1:]:
                      key, _, value = kv.partition("=")
                      row[key] = value
                  rows.append(row)
          if not rows:
              print("no complete shard rows this week — leaving the trend untouched")
              raise SystemExit(0)

          trend_path = Path("audit_reports/mutation-trend.json")
          trend = json.loads(trend_path.read_text()) if trend_path.exists() else []
          trend.append({
              "recorded_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": "${{ github.run_id }}",
              "domains": rows,
          })
          trend = trend[-104:]
          trend_path.parent.mkdir(parents=True, exist_ok=True)
          trend_path.write_text(json.dumps(trend, indent=2) + "\n")
          print(f"appended {len(rows)} frontend shard rows ({len(trend)} total)")
          PY

      - name: Commit trend update
        run: |
          git config user.name "goatfarm-ci"
          git config user.email "ci@goatfarm.invalid"
          git add audit_reports/mutation-trend.json
          if git diff --cached --quiet; then
            echo "trend unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "mutation: record weekly frontend shard scores (run ${{ github.run_id }}) [skip ci]"
          git push
