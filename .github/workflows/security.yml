name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # Only stale PR revisions are disposable. Main and scheduled scans must
  # finish so every shipped commit/run retains a conclusive security result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 2026-09-16 audit (remediation log P3): pip-audit/pnpm-audit previously ran
  # only on push/PR in ci.yml, so NEW advisories against pinned versions were
  # invisible until the next code change (Dependabot aside). This job closes
  # the weekly gap on the existing Security schedule.
  dependency-audit:
    name: Dependency advisories (pip + pnpm)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv (same hash-pinned bootstrap as ci.yml)
        working-directory: backend
        run: python -m pip install --no-cache-dir --require-hashes -r pins/uv.txt
      - name: pip-audit (backend, frozen lock export)
        working-directory: backend
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt \
            --output-file /tmp/goatfarm-requirements.txt
          # Same hash-locked audit toolchain as ci.yml (pins/pip-audit.txt,
          # transitive closure included, installed with --require-hashes).
          uv venv /tmp/pip-audit-venv
          uv pip install --python /tmp/pip-audit-venv/bin/python \
            --require-hashes -r pins/pip-audit.txt
          /tmp/pip-audit-venv/bin/pip-audit --requirement /tmp/goatfarm-requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
      - name: pnpm audit (frontend, lockfile)
        working-directory: frontend
        run: |
          corepack enable
          pnpm audit --audit-level=low

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # CodeQL reads workflow-run metadata when finalizing a private-repository
      # analysis. Without this permission both language jobs fail after the
      # queries and SARIF export have already completed.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        id: codeql-analyze
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          # GitHub Code Scanning is not enabled for this private repository,
          # so its upload API returns 403 after an otherwise successful scan.
          # Preserve the results as an Actions artifact instead. When Code
          # Security is enabled, change this to "always" and restore the
          # security-events: write permission above.
          upload: never
          upload-database: false
          output: codeql-results/${{ matrix.language }}
      - name: Preserve CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 30
      - name: Fail on CodeQL error or high-severity findings
        # Private repositories without GitHub Code Security cannot upload SARIF
        # to the Code Scanning API. Preserve the artifact above, then apply the
        # same error/high threshold locally so findings still fail CI.
        env:
          SARIF_OUTPUT: ${{ steps.codeql-analyze.outputs.sarif-output }}
        run: python3 .github/scripts/gate_sarif.py "${SARIF_OUTPUT}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-ignore-freshness:
    # L-5 (2026-09-20 audit): the compose-image ignore file masks
    # acknowledged CVEs in digest-pinned third-party images under a weekly
    # refresh policy nothing enforced. Fail every security run (push, PR,
    # weekly) once its `# refreshed:` marker is older than the policy window
    # so the suppressed-CVE debt stays bounded.
    name: Compose-image ignore file freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check the ignore-file refresh marker
        run: python backend/scripts/check_trivy_ignore_freshness.py

  container:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep these digest-pinned references in lockstep with docker-compose:
      # the database and edge are deployed images, not mere build dependencies.
      COMPOSE_POSTGRES_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
      COMPOSE_NGINX_IMAGE: nginx:1.30-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: goatfarm-backend:security
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: goatfarm-frontend:security
      - name: Pull exact Compose infrastructure images
        run: |
          docker pull "${COMPOSE_POSTGRES_IMAGE}"
          docker pull "${COMPOSE_NGINX_IMAGE}"
      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: goatfarm-backend:security
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: goatfarm-backend-sbom
          upload-artifact-retention: 30
      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: goatfarm-frontend:security
          format: spdx-json
          output-file: frontend-sbom.spdx.json
          artifact-name: goatfarm-frontend-sbom
          upload-artifact-retention: 30
      - name: Generate Compose PostgreSQL SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.COMPOSE_POSTGRES_IMAGE }}
          format: spdx-json
          output-file: compose-postgres-sbom.spdx.json
          artifact-name: goatfarm-compose-postgres-sbom
          upload-artifact-retention: 30
      - name: Generate Compose nginx SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.COMPOSE_NGINX_IMAGE }}
          format: spdx-json
          output-file: compose-nginx-sbom.spdx.json
          artifact-name: goatfarm-compose-nginx-sbom
          upload-artifact-retention: 30
      - name: Scan backend image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goatfarm-backend:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goatfarm-frontend:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Compose PostgreSQL image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_POSTGRES_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Third-party compose images have no build step where a package
          # upgrade could apply upstream fixes; the ignore file documents
          # each residual (fix published upstream, image not yet rebuilt)
          # and its refresh policy. Scoped to these two steps only.
          trivyignores: .trivyignore.compose-images
          # Debian's ssl-cert package ships a build-time-generated self-signed
          # "snakeoil" key pair at this path on every install — public
          # placeholder material, not a deployment secret.
          skip-files: /etc/ssl/private/ssl-cert-snakeoil.key
      - name: Scan Compose nginx image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_NGINX_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.compose-images
