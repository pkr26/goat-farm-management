name: Release

# Container CD: push a v* tag to build both application images for
# linux/amd64 + linux/arm64, gate each architecture on the same Trivy policy
# as security.yml BEFORE anything is published, then push multi-arch manifests
# to ghcr.io with provenance+SBOM attestations and cut a GitHub release
# carrying the per-architecture SPDX SBOMs. Tags are cut only after the CI
# gate on main is green, so this workflow runs no tests itself.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Two runs for the same tag must not interleave pushes; let them queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build, scan, SBOM, publish
    runs-on: ubuntu-latest
    # The arm64 legs build under QEMU, and each architecture is built twice
    # (once loaded locally for the gate, once for the pushed multi-arch
    # manifest, with the second build hitting the first's layer cache). That
    # can exceed the old 40-minute single-arch budget several times over, so
    # keep a generous ceiling for a rarely-run workflow.
    timeout-minutes: 90
    permissions:
      # GITHUB_TOKEN pushes the two images to ghcr.io. No other job in this
      # workflow may write packages.
      packages: write
      contents: read
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_digest: ${{ steps.assemble.outputs.backend_digest }}
      frontend_digest: ${{ steps.assemble.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (arm64 emulation)
        # The published images are multi-arch; the arm64 legs need emulation
        # on the amd64 hosted runner.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image names
        id: images
        # GHCR requires lowercase repository names; repository_owner may
        # contain uppercase, so normalize once here and reuse via env.
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/goatfarm-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/goatfarm-frontend" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/goatfarm-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/goatfarm-frontend" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      # ── Gate phase ─────────────────────────────────────────────────────
      # Build each image per architecture into the local daemon and run the
      # Trivy gate on those bits. Nothing is pushed until every scan below
      # has passed, so a vulnerable build can never leave a deployable tag
      # in the registry. Per-arch builds are required because the same tag
      # resolves to different base-image layers (and CVE sets) on amd64 and
      # arm64. provenance is disabled for load builds: attestations cannot
      # be represented in a docker-load tarball and are attached by the
      # publish builds below instead.

      - name: Gate-build backend (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend (linux/amd64) for fixable high/critical vulnerabilities
        # Same policy as security.yml: fail before publishing on any fixable
        # high/critical vulnerability. Trivy resolves the locally loaded image
        # by this tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build frontend (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend (linux/amd64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build backend (linux/arm64, QEMU)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend (linux/arm64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build frontend (linux/arm64, QEMU)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend (linux/arm64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # SPDX SBOMs from the exact per-architecture images that were just
      # gated — one asset per architecture, because the base-image package
      # sets differ between amd64 and arm64.
      - name: Generate backend SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: spdx-json
          output-file: backend-sbom-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate backend SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: spdx-json
          output-file: backend-sbom-linux-arm64.spdx.json
          upload-artifact: false

      - name: Generate frontend SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: spdx-json
          output-file: frontend-sbom-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate frontend SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: spdx-json
          output-file: frontend-sbom-linux-arm64.spdx.json
          upload-artifact: false

      - name: Preserve SBOM artifacts
        # Uploaded by the pinned upload-artifact step so the release job
        # gets a deterministic download path.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms
          path: |
            backend-sbom-linux-amd64.spdx.json
            backend-sbom-linux-arm64.spdx.json
            frontend-sbom-linux-amd64.spdx.json
            frontend-sbom-linux-arm64.spdx.json
          retention-days: 30

      # ── Publish phase ──────────────────────────────────────────────────
      # Only reached after every per-arch scan passed. RT-R-6 follow-up
      # (2026-09-16 audit): the previous flow REBUILT multi-arch images for
      # publish, so a cache miss or base-image republish between gate and
      # publish could ship bits that were never scanned. Now each
      # architecture is published exactly once to a per-arch tag, the pushed
      # image's config digest is verified against the locally loaded,
      # gate-scanned image, and only after that verification are the two
      # per-arch manifests (with their provenance/SBOM attestations)
      # assembled into the release tag with `buildx imagetools create`.
      #
      # Known, bounded exception to "nothing is pushed before verification"
      # (2026-09-17 re-audit): registry-side verification requires the
      # per-arch bits to exist in the registry, so the two-phase push is
      # inherent. The per-arch "-publish-*" tags are short-lived scaffolding
      # — never referenced by a deploy — and the cleanup step at the end of
      # this job removes them when verification fails.

      - name: Publish backend image (linux/amd64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-publish-amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish backend image (linux/arm64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-publish-arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish frontend image (linux/amd64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-publish-amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish frontend image (linux/arm64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-publish-arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Verify published bits are the scanned bits (RT-R-6)
        # The pushed per-arch tag is an OCI index (image manifest + attestation
        # manifests). Walk to the platform's image manifest and compare its
        # config digest with the locally loaded gate image's Id — equal config
        # digest + equal build inputs means the exact scanned filesystem
        # shipped. Any divergence (cache miss, base-image republish) fails the
        # release instead of shipping unscanned layers.
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          verify() {
            local image="$1" arch="$2"
            local gate_id index image_manifest config_digest
            gate_id="$(docker inspect --format '{{.Id}}' "${image}:${TAG}-gate-${arch}")"
            index="$(docker buildx imagetools inspect --raw "${image}:${TAG}-publish-${arch}")"
            image_manifest="$(printf '%s' "$index" | jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux" and (has("vnd.docker.reference.type") | not)) | .digest')"
            if [ -z "$image_manifest" ] || [ "$image_manifest" = "null" ]; then
              echo "::error::no ${arch} image manifest found under ${image}:${TAG}-publish-${arch}"
              exit 1
            fi
            config_digest="$(docker buildx imagetools inspect --raw "${image}@${image_manifest}" | jq -r '.config.digest')"
            if [ "$gate_id" != "$config_digest" ]; then
              echo "::error::published ${arch} bits for ${image} diverge from the scanned gate image (gate ${gate_id} vs published ${config_digest}); refusing to assemble the release tag"
              exit 1
            fi
            echo "verified ${image} ${arch}: ${config_digest}"
          }
          for arch in amd64 arm64; do
            verify "$BACKEND_IMAGE" "$arch"
            verify "$FRONTEND_IMAGE" "$arch"
          done

      - name: Assemble release tags from the verified per-arch images
        id: assemble
        # imagetools create copies the per-arch indexes (including their
        # provenance/SBOM attestations) under the release tag — no rebuild,
        # no second chance for the bits to change.
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${BACKEND_IMAGE}:${TAG}" \
            "${BACKEND_IMAGE}:${TAG}-publish-amd64" \
            "${BACKEND_IMAGE}:${TAG}-publish-arm64"
          docker buildx imagetools create \
            -t "${FRONTEND_IMAGE}:${TAG}" \
            "${FRONTEND_IMAGE}:${TAG}-publish-amd64" \
            "${FRONTEND_IMAGE}:${TAG}-publish-arm64"
          backend_digest="$(docker buildx imagetools inspect --raw "${BACKEND_IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)"
          frontend_digest="$(docker buildx imagetools inspect --raw "${FRONTEND_IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)"
          echo "backend_digest=sha256:${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=sha256:${frontend_digest}" >> "$GITHUB_OUTPUT"

      - name: Remove unverified per-arch publish tags on failure
        # 2026-09-17 re-audit: a verification divergence (or a mid-publish
        # crash) correctly aborts the release, but the four "-publish-*"
        # tags it already pushed would otherwise linger in GHCR holding
        # never-verified bits until the next release overwrote them. Delete
        # the package versions carrying those tags. Best-effort: if the
        # GITHUB_TOKEN's packages:write cannot delete (org policy), say so
        # loudly instead of failing the already-failed job — the release tag
        # itself was never assembled, so nothing deployable exists.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if gh api "orgs/${owner}" >/dev/null 2>&1; then
            api_base="orgs/${owner}"
          else
            api_base="user"
          fi
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            package="${image##*/}"
            for arch in amd64 arm64; do
              tag="${TAG}-publish-${arch}"
              ids="$(gh api --paginate "${api_base}/packages/container/${package}/versions" \
                | jq -r --arg tag "$tag" \
                  '.[] | select((.metadata.container.tags // []) | index($tag)) | .id' || true)"
              for id in $ids; do
                if gh api -X DELETE "${api_base}/packages/container/${package}/versions/${id}"; then
                  echo "removed unverified ${image}:${tag} (package version ${id})"
                else
                  echo "::warning::could not remove ${image}:${tag} (package version ${id}); delete it manually in the package settings"
                fi
              done
            done
          done

  release:
    name: GitHub release with SBOMs
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job — and only after the Trivy gate passed — may write to
      # the repository: it creates the release on the pushed tag.
      contents: write
    env:
      # No checkout in this job: gh cannot infer the repository without a
      # git remote, and it does not read GITHUB_REPOSITORY. Point it at the
      # target repo explicitly.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.images.outputs.frontend_digest }}
    steps:
      - name: Download SBOM assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sboms
          path: release-assets

      - name: Create or update release with SBOM assets
        run: |
          tag="${GITHUB_REF_NAME}"
          # v1.2.3-rc1 / -beta tags publish as pre-releases, not latest.
          args=(--title "$tag" --generate-notes)
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac
          assets=(release-assets/*.spdx.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run after a partial failure: never duplicate the release,
            # just refresh its assets and digest notes.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${args[@]}" "${assets[@]}"
          fi
          # Pin the published digests in the notes so deployments can verify
          # what the tag resolved to at release time. Idempotent on re-run.
          gh release view "$tag" --json body --jq .body > release-body.md
          if ! grep -q "Published image digests" release-body.md; then
            {
              echo
              echo "### Published image digests"
              echo
              echo "- \`${BACKEND_IMAGE}:${tag}\` (linux/amd64, linux/arm64) → \`${BACKEND_DIGEST}\`"
              echo "- \`${FRONTEND_IMAGE}:${tag}\` (linux/amd64, linux/arm64) → \`${FRONTEND_DIGEST}\`"
            } >> release-body.md
            gh release edit "$tag" --notes-file release-body.md
          fi
