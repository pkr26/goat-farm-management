name: Release

# Container CD: push a v* tag to build the backend, frontend, and edge images for
# linux/amd64 + linux/arm64, gate each architecture on the same Trivy policy
# as security.yml BEFORE anything is published, then push multi-arch manifests
# to ghcr.io with provenance+SBOM attestations and cut a GitHub release
# carrying the per-architecture SPDX SBOMs. A release tag is accepted only
# when its exact commit is reachable from main and has a completed successful
# CI and Security push runs; repository tag protection remains an additional
# control, not the sole release gate. Version tags and artifacts are one-shot:
# a changed build must use a new version.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Two runs for the same tag must not interleave pushes; let them queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build, scan, SBOM, publish
    runs-on: ubuntu-latest
    # The arm64 legs build under QEMU, and each architecture is built twice
    # (once loaded locally for the gate, once for the pushed multi-arch
    # manifest, with the second build hitting the first's layer cache). That
    # can exceed the old 40-minute single-arch budget several times over, so
    # keep a generous ceiling for a rarely-run workflow.
    timeout-minutes: 90
    permissions:
      # GITHUB_TOKEN pushes the three images to ghcr.io. No other job in this
      # workflow may write packages.
      packages: write
      contents: read
      actions: read
      id-token: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      edge_image: ${{ steps.images.outputs.edge_image }}
      backend_digest: ${{ steps.assemble.outputs.backend_digest }}
      frontend_digest: ${{ steps.assemble.outputs.frontend_digest }}
      edge_digest: ${{ steps.assemble.outputs.edge_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require successful CI and Security for the tagged main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "::error::Refusing release: $TAGGED_SHA is not reachable from main."
            exit 1
          fi
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TAGGED_SHA}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .event == "push") | .id' \
            | grep -q . || {
              echo "::error::Refusing release: no successful push CI run exists for $TAGGED_SHA."
              exit 1
            }
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/security.yml/runs?head_sha=${TAGGED_SHA}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .event == "push") | .id' \
            | grep -q . || {
              echo "::error::Refusing release: no successful push Security run exists for $TAGGED_SHA."
              exit 1
            }

      - name: Set up QEMU (arm64 emulation)
        # The published images are multi-arch; the arm64 legs need emulation
        # on the amd64 hosted runner.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          # This image runs privileged to register binfmt handlers. Pin the
          # exact OCI index and install only the one cross-target we build.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Resolve image names
        id: images
        # GHCR requires lowercase repository names; repository_owner may
        # contain uppercase, so normalize once here and reuse via env.
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/goatfarm-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/goatfarm-frontend" >> "$GITHUB_OUTPUT"
          echo "edge_image=ghcr.io/${owner}/goatfarm-edge" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/goatfarm-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/goatfarm-frontend" >> "$GITHUB_ENV"
          echo "EDGE_IMAGE=ghcr.io/${owner}/goatfarm-edge" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Refuse an existing immutable release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; publish changed bits under a new version."
            exit 1
          fi
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$EDGE_IMAGE"; do
            if docker buildx imagetools inspect "${image}:${TAG}" >/dev/null 2>&1; then
              echo "::error::Immutable image tag ${image}:${TAG} already exists."
              exit 1
            fi
          done

      # ── Gate phase ─────────────────────────────────────────────────────
      # Build each image per architecture into the local daemon and run the
      # Trivy gate on those bits. Nothing is pushed until every scan below
      # has passed, so a vulnerable build can never leave a deployable tag
      # in the registry. Per-arch builds are required because the same tag
      # resolves to different base-image layers (and CVE sets) on amd64 and
      # arm64. provenance is disabled for load builds: attestations cannot
      # be represented in a docker-load tarball and are attached by the
      # publish builds below instead.

      - name: Gate-build backend (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend (linux/amd64) for fixable high/critical vulnerabilities
        # Same policy as security.yml: fail before publishing on any fixable
        # high/critical vulnerability. Trivy resolves the locally loaded image
        # by this tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build frontend (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend (linux/amd64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build edge (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan edge (linux/amd64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build backend (linux/arm64, QEMU)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend (linux/arm64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build frontend (linux/arm64, QEMU)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend (linux/arm64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gate-build edge (linux/arm64, QEMU)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan edge (linux/arm64) for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # SPDX SBOMs from the exact per-architecture images that were just
      # gated — one asset per architecture, because the base-image package
      # sets differ between amd64 and arm64.
      - name: Generate backend SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: spdx-json
          output-file: backend-sbom-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate backend SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: spdx-json
          output-file: backend-sbom-linux-arm64.spdx.json
          upload-artifact: false

      - name: Generate frontend SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: spdx-json
          output-file: frontend-sbom-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate frontend SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: spdx-json
          output-file: frontend-sbom-linux-arm64.spdx.json
          upload-artifact: false

      - name: Generate edge SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-amd64
          format: spdx-json
          output-file: edge-sbom-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate edge SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-gate-arm64
          format: spdx-json
          output-file: edge-sbom-linux-arm64.spdx.json
          upload-artifact: false

      - name: Preserve SBOM artifacts
        # Uploaded by the pinned upload-artifact step so the release job
        # gets a deterministic download path.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms
          path: |
            backend-sbom-linux-amd64.spdx.json
            backend-sbom-linux-arm64.spdx.json
            frontend-sbom-linux-amd64.spdx.json
            frontend-sbom-linux-arm64.spdx.json
            edge-sbom-linux-amd64.spdx.json
            edge-sbom-linux-arm64.spdx.json
          retention-days: 30

      # Publish phase: each architecture must match its locally scanned
      # config digest before its manifest joins the release tag. Registry
      # verification requires temporary per-architecture publish tags;
      # these are never deployment references and are cleaned up on failure.

      - name: Publish backend image (linux/amd64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-publish-amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish backend image (linux/arm64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}-publish-arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish frontend image (linux/amd64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-publish-amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish frontend image (linux/arm64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}-publish-arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish edge image (linux/amd64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-publish-amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Publish edge image (linux/arm64, exact gate bits)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/edge/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.EDGE_IMAGE }}:${{ env.TAG }}-publish-arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Verify published bits are the scanned bits (RT-R-6)
        # The pushed per-arch tag is an OCI index (image manifest + attestation
        # manifests). Walk to the platform's image manifest and compare its
        # config digest with the locally loaded gate image's Id — equal config
        # digest + equal build inputs means the exact scanned filesystem
        # shipped. Any divergence (cache miss, base-image republish) fails the
        # release instead of shipping unscanned layers.
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          EDGE_IMAGE: ${{ env.EDGE_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          verify() {
            local image="$1" arch="$2"
            local gate_id index image_manifest config_digest
            gate_id="$(docker inspect --format '{{.Id}}' "${image}:${TAG}-gate-${arch}")"
            index="$(docker buildx imagetools inspect --raw "${image}:${TAG}-publish-${arch}")"
            image_manifest="$(printf '%s' "$index" | jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux" and (has("vnd.docker.reference.type") | not)) | .digest')"
            if [ -z "$image_manifest" ] || [ "$image_manifest" = "null" ]; then
              echo "::error::no ${arch} image manifest found under ${image}:${TAG}-publish-${arch}"
              exit 1
            fi
            config_digest="$(docker buildx imagetools inspect --raw "${image}@${image_manifest}" | jq -r '.config.digest')"
            if [ "$gate_id" != "$config_digest" ]; then
              echo "::error::published ${arch} bits for ${image} diverge from the scanned gate image (gate ${gate_id} vs published ${config_digest}); refusing to assemble the release tag"
              exit 1
            fi
            echo "verified ${image} ${arch}: ${config_digest}"
          }
          for arch in amd64 arm64; do
            verify "$BACKEND_IMAGE" "$arch"
            verify "$FRONTEND_IMAGE" "$arch"
            verify "$EDGE_IMAGE" "$arch"
          done

      - name: Assemble release tags from the verified per-arch images
        id: assemble
        # imagetools create copies the per-arch indexes (including their
        # provenance/SBOM attestations) under the release tag — no rebuild,
        # no second chance for the bits to change.
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          EDGE_IMAGE: ${{ env.EDGE_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          # The immutable version tags did not exist at preflight. Once this
          # marker exists, failure cleanup may remove only version tags owned
          # by this run; it must never touch a tag that made preflight fail.
          touch "${RUNNER_TEMP}/goatfarm-release-assembly-owned"
          docker buildx imagetools create \
            -t "${BACKEND_IMAGE}:${TAG}" \
            "${BACKEND_IMAGE}:${TAG}-publish-amd64" \
            "${BACKEND_IMAGE}:${TAG}-publish-arm64"
          docker buildx imagetools create \
            -t "${FRONTEND_IMAGE}:${TAG}" \
            "${FRONTEND_IMAGE}:${TAG}-publish-amd64" \
            "${FRONTEND_IMAGE}:${TAG}-publish-arm64"
          docker buildx imagetools create \
            -t "${EDGE_IMAGE}:${TAG}" \
            "${EDGE_IMAGE}:${TAG}-publish-amd64" \
            "${EDGE_IMAGE}:${TAG}-publish-arm64"
          manifest_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }
          backend_digest="$(manifest_digest "${BACKEND_IMAGE}:${TAG}")"
          frontend_digest="$(manifest_digest "${FRONTEND_IMAGE}:${TAG}")"
          edge_digest="$(manifest_digest "${EDGE_IMAGE}:${TAG}")"
          echo "backend_digest=${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=${frontend_digest}" >> "$GITHUB_OUTPUT"
          echo "edge_digest=${edge_digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / cosign v3.0.6

      - name: Sign immutable release image manifests
        env:
          BACKEND_DIGEST: ${{ steps.assemble.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.assemble.outputs.frontend_digest }}
          EDGE_DIGEST: ${{ steps.assemble.outputs.edge_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          cosign sign --yes "${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
          cosign sign --yes "${EDGE_IMAGE}@${EDGE_DIGEST}"

      - name: Remove incomplete release and per-arch publish tags on failure
        # Delete only this run's temporary tags and owned release tags.
        # Registry policy can block deletion; report that without hiding the
        # original failure. Final tags require the assembly ownership marker.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          EDGE_IMAGE: ${{ env.EDGE_IMAGE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if gh api "orgs/${owner}" >/dev/null 2>&1; then
            api_base="orgs/${owner}"
          else
            api_base="user"
          fi
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$EDGE_IMAGE"; do
            package="${image##*/}"
            tags=("${TAG}-publish-amd64" "${TAG}-publish-arm64")
            if [ -f "${RUNNER_TEMP}/goatfarm-release-assembly-owned" ]; then
              tags+=("${TAG}")
            fi
            for tag in "${tags[@]}"; do
              ids="$(gh api --paginate "${api_base}/packages/container/${package}/versions" \
                | jq -r --arg tag "$tag" \
                  '.[] | select((.metadata.container.tags // []) | index($tag)) | .id' || true)"
              for id in $ids; do
                if gh api -X DELETE "${api_base}/packages/container/${package}/versions/${id}"; then
                  echo "removed unverified ${image}:${tag} (package version ${id})"
                else
                  echo "::warning::could not remove ${image}:${tag} (package version ${id}); delete it manually in the package settings"
                fi
              done
            done
          done

  release:
    name: GitHub release with SBOMs
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job — and only after the Trivy gate passed — may write to
      # the repository: it creates the release on the pushed tag.
      contents: write
      id-token: write
    env:
      # No checkout in this job: gh cannot infer the repository without a
      # git remote, and it does not read GITHUB_REPOSITORY. Point it at the
      # target repo explicitly.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
      EDGE_IMAGE: ${{ needs.images.outputs.edge_image }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.images.outputs.frontend_digest }}
      EDGE_DIGEST: ${{ needs.images.outputs.edge_digest }}
    steps:
      - name: Download SBOM assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-sboms
          path: release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / cosign v3.0.6

      - name: Create signed checksums and immutable release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists and is immutable; use a new version."
            exit 1
          fi
          (
            cd release-assets
            sha256sum ./*.spdx.json > SHA256SUMS
          )
          cosign sign-blob --yes \
            --bundle release-assets/SHA256SUMS.sigstore.json \
            release-assets/SHA256SUMS
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            --jq .body > release-body.md
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path

          path = Path("release-body.md")
          body = path.read_text().rstrip()
          tag = os.environ["GITHUB_REF_NAME"]
          block = ["### Published image digests", ""]
          for component in ("BACKEND", "FRONTEND", "EDGE"):
              image = os.environ[f"{component}_IMAGE"]
              digest = os.environ[f"{component}_DIGEST"]
              block.append(f"- `{image}:{tag}` (linux/amd64, linux/arm64) → `{digest}`")
          block.extend(
              [
                  "",
                  "Images and release checksums are keyless-signed by the pinned release workflow.",
                  "See SECURITY.md for the issuer/identity verification policy.",
                  "",
                  "SBOM assets from this build:",
              ]
          )
          for asset in sorted(Path("release-assets").glob("*.spdx.json")):
              block.append(f"- `{asset.name}`")
          path.write_text(body + "\n\n" + "\n".join(block) + "\n")
          PYNOTES
          args=(--title "$tag" --notes-file release-body.md)
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac
          assets=(release-assets/*)
          gh release create "$tag" "${args[@]}" "${assets[@]}"
