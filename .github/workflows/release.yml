name: Release

# Container CD: push a v* tag to build and publish both application images to
# ghcr.io, gate them on the same Trivy policy as security.yml, and cut a
# GitHub release carrying the SPDX SBOMs. Tags are cut only after the CI gate
# on main is green, so this workflow runs no tests itself.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # Two runs for the same tag must not interleave pushes; let them queue.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build, push, SBOM, scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # GITHUB_TOKEN pushes the two images to ghcr.io. No other job in this
      # workflow may write packages.
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image names
        # GHCR requires lowercase repository names; repository_owner may
        # contain uppercase, so normalize once here and reuse via env.
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${owner}/goatfarm-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/goatfarm-frontend" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Build and push backend image
        # provenance/sbom via buildx attach the SLSA provenance and SPDX SBOM
        # attestations to the pushed multi-manifest image in the registry.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          provenance: mode=max
          sbom: true

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          provenance: mode=max
          sbom: true

      - name: Pull pushed images back
        # Scans and SBOMs below run against the exact manifests that were
        # published, not a second local build whose digest could differ.
        run: |
          docker pull "${BACKEND_IMAGE}:${TAG}"
          docker pull "${FRONTEND_IMAGE}:${TAG}"

      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: backend-sbom.spdx.json
          # Uploaded by the pinned upload-artifact steps below so the release
          # job gets deterministic download paths.
          upload-artifact: false

      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: frontend-sbom.spdx.json
          upload-artifact: false

      - name: Preserve backend SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goatfarm-backend-sbom
          path: backend-sbom.spdx.json
          retention-days: 30

      - name: Preserve frontend SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goatfarm-frontend-sbom
          path: frontend-sbom.spdx.json
          retention-days: 30

      # Same policy as security.yml: fail the release on any fixable
      # high/critical vulnerability in either image.
      - name: Scan backend image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    name: GitHub release with SBOMs
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job — and only after the Trivy gate passed — may write to
      # the repository: it creates the release on the pushed tag.
      contents: write
    steps:
      - name: Download backend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: goatfarm-backend-sbom
          path: release-assets

      - name: Download frontend SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: goatfarm-frontend-sbom
          path: release-assets

      - name: Create release with SBOM assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/backend-sbom.spdx.json release-assets/frontend-sbom.spdx.json
