name: Mutation assurance

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/alembic/**"
      - "backend/scripts/**"
      - "backend/pins/**"
      - "backend/mutation/**"
      - "backend/alembic.ini"
      - "backend/.env.example"
      - "backend/uv.lock"
      - "backend/pyproject.toml"
      - "frontend/src/**"
      - "frontend/mutation/**"
      - "frontend/patches/**"
      - "frontend/public/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/vite*.config.*"
      - "frontend/vitest*.config.*"
      - "frontend/vitest.setup.ts"
      - "frontend/tsconfig.json"
      - "frontend/next.config.ts"
      - "frontend/.nvmrc"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - ".github/**"
      - "docker/**"
      - "shared/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".env.example"
      - ".trivyignore.compose-images"
      - "README.md"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Create runner Postgres role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"

      - name: Install backend mutation dependencies
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir --require-hashes -r pins/uv.txt
          uv lock --check
          uv sync --locked --extra dev

      - name: Select changed backend production files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- backend/app \
              | sed 's#^backend/##' | paste -sd, -)"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Build a fresh provenance-bound coverage map
        working-directory: backend
        run: |
          .venv/bin/python mutation/mutate_gen.py
          .venv/bin/python mutation/mutate_cover.py
          : > mutation/results.jsonl

      - name: Run bounded complete-selection backend mutations
        working-directory: backend
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          args=(--full --workers 2 --limit 25)
          if [ -n "$CHANGED_FILES" ]; then
            args+=(--files "$CHANGED_FILES")
          fi
          .venv/bin/python mutation/mutate_run.py "${args[@]}" --dry-run > mutation/ci-plan.json
          .venv/bin/python mutation/mutate_run.py "${args[@]}"
          .venv/bin/python mutation/mutate_report.py --dry-run > mutation/ci-report.json
          .venv/bin/python ../.github/scripts/check_mutation_report.py \
            --plan mutation/ci-plan.json \
            --report mutation/ci-report.json \
            --results mutation/results.jsonl \
            --format backend \
            --minimum 80

      - name: Upload backend mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/mutation/ci-plan.json
            backend/mutation/ci-report.json
            backend/mutation/results.jsonl
            backend/mutation/manifest.json
            backend/.coverage-mut.provenance.json
          retention-days: 30

  frontend-changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend mutation dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Select changed frontend production files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA...HEAD" -- frontend/src \
              | grep -Ev '\.(test|d)\.(ts|tsx)$' | sed 's#^frontend/##' | paste -sd, - || true)"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Build a fresh provenance-bound coverage map
        working-directory: frontend
        run: |
          node mutation/mutate_gen.mjs
          node mutation/mutate_cover.mjs
          : > mutation/results.jsonl

      - name: Run bounded complete-selection frontend mutations
        working-directory: frontend
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.files }}
        run: |
          args=(--full --sample 25)
          if [ -n "$CHANGED_FILES" ]; then
            args+=(--only "$CHANGED_FILES")
          fi
          node mutation/mutate_run.mjs "${args[@]}" --dry-run > mutation/ci-plan.json
          node mutation/mutate_run.mjs "${args[@]}"
          node mutation/mutate_report.mjs --dry-run > mutation/ci-report.json
          python ../.github/scripts/check_mutation_report.py \
            --plan mutation/ci-plan.json \
            --report mutation/ci-report.json \
            --results mutation/results.jsonl \
            --format frontend \
            --minimum 80

      - name: Upload frontend mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/mutation/ci-plan.json
            frontend/mutation/ci-report.json
            frontend/mutation/results.jsonl
            frontend/mutation/manifest.json
            frontend/mutation/coverage-map.json
          retention-days: 30
