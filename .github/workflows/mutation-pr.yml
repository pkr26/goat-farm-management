name: PR mutation gate

# Diff-scoped surgical mutation gate for the two classes of change that
# cannot wait for the weekly campaign:
#   * tenancy-critical paths (routers, deps.py, permissions.py, idempotency)
#   * the simulation financial core
# scripts/mutation_gate.py maps a small curated mutant catalog onto the PR's
# changed files and runs only the mutants whose source files the PR touches;
# any SURVIVING mutant fails the check. The gate is intentionally narrow —
# broad coverage stays with the weekly per-domain mutmut matrix
# (mutation.yml) and the dated audit-bundle campaigns.
on:
  pull_request:
    paths:
      - "backend/app/api/**"
      - "backend/app/deps.py"
      - "backend/app/permissions.py"
      - "backend/app/services/idempotency.py"
      - "backend/app/simulation/**"
      - "backend/scripts/mutation_gate.py"

concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: diff-scoped mutants (tenancy + financial core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GOATFARM_TEST_DB: goatfarm_test_gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the gate diffs against the PR base

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Cache uv downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Create runner Postgres role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"

      - name: Install backend (+ dev tools)
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir uv==0.12.1
          uv lock --check
          uv sync --locked --extra dev

      - name: Determine PR base
        id: base
        run: |
          git fetch origin "$PR_BASE" --depth=1
          echo "sha=origin/$PR_BASE" >> "$GITHUB_OUTPUT"
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}

      - name: Run diff-scoped mutation gate
        working-directory: backend
        run: .venv/bin/python scripts/mutation_gate.py --base "${{ steps.base.outputs.sha }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### PR mutation gate"
            echo "Diff-scoped surgical mutants over tenancy-critical paths and the"
            echo "financial core. A surviving mutant means the targeted suites pass"
            echo "with a tenant-filter or pricing mutation applied — fix the tests,"
            echo "or fix the code if the mutant exposed a real hole."
          } >> "$GITHUB_STEP_SUMMARY"
