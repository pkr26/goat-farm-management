name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR so we don't burn minutes on stale
# commits. Every merged main commit still gets a complete, uncancelled run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # pytest drives a real PostgreSQL and is the only slow step here — every
    # other step in this job finishes inside a minute. At ~3,000 tests it needs
    # a little over 20 minutes on a hosted runner, so a 20-minute job budget
    # cancelled it mid-run. Keep enough headroom that growing the suite does not
    # turn into a red build for the wrong reason.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # conftest connects to postgres without an explicit user, i.e. as the
      # runner OS user — give that role superuser so it can create the test DB.
      - name: Create runner Postgres role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"

      - name: Install backend (+ dev tools)
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir uv==0.12.1
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: mypy --strict
        working-directory: backend
        run: python -m mypy --strict app

      - name: OpenAPI snapshot is current
        working-directory: backend
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../shared/openapi.json

      - name: Migration round-trip and metadata drift check
        working-directory: backend
        env:
          GOATFARM_DATABASE_URL: postgresql+asyncpg://localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check
          # Exercise the complete historical chain in both directions.  A
          # partial downgrade can leave early revisions permanently untested
          # until a real restore or rollback needs them.
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: pytest (real PostgreSQL)
        working-directory: backend
        env:
          GOATFARM_TEST_DB: goatfarm_test
        run: python -m pytest -q

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt \
            --output-file /tmp/goatfarm-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/goatfarm-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: TypeScript
        working-directory: frontend
        run: pnpm typecheck

      - name: Generated API client is current
        working-directory: frontend
        run: |
          pnpm orval
          git diff --exit-code -- src/api/generated

      - name: Vitest
        working-directory: frontend
        run: pnpm test

      - name: Production build + typecheck
        working-directory: frontend
        run: pnpm build

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: pnpm audit --audit-level=low

  # End-to-end: Playwright drives the real SPA against a live FastAPI +
  # PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # playwright.config.ts's webServer boots both backend and a production
      # Next standalone server; the backend needs a DB URL and the auth
      # limiter off (E2E register flow bursts past the per-IP window).
      GOATFARM_DATABASE_URL: postgresql+asyncpg://runner@localhost:5432/goatfarm_e2e
      GOATFARM_AUTH_RATE_LIMIT_ENABLED: "false"
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Create runner Postgres role
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE goatfarm_e2e OWNER runner"

      - name: Enable pnpm
        run: corepack enable

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir uv==0.12.1
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright e2e
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Sanity-check the Dockerfile still builds so a broken image doesn't
  # land on main unnoticed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: goatfarm-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: goatfarm-frontend:ci
      - name: Exercise authentication in the built image
        run: |
          docker run --rm --network host \
            -e GOATFARM_DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/postgres \
            goatfarm-backend:ci alembic upgrade head
          docker run --rm --detach --name goatfarm-backend-smoke --network host \
            -e GOATFARM_DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/postgres \
            -e GOATFARM_AUTH_RATE_LIMIT_ENABLED=false \
            goatfarm-backend:ci
          cleanup() {
            docker logs goatfarm-backend-smoke || true
            docker stop goatfarm-backend-smoke || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Built image did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          response="$(curl --fail-with-body --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"container-smoke@example.com","password":"containerpass123"}' \
            http://localhost:8000/api/auth/register)"
          test "$(jq -r '.access_token | type' <<<"$response")" = "string"
