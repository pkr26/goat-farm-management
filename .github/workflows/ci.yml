name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR so we don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # conftest connects to postgres without an explicit user, i.e. as the
      # runner OS user — give that role superuser so it can create the test DB.
      - name: Create runner Postgres role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"

      - name: Install backend (+ dev tools)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: mypy --strict
        working-directory: backend
        run: python -m mypy --strict app

      - name: pytest (real PostgreSQL)
        working-directory: backend
        env:
          GOATFARM_TEST_DB: goatfarm_test
        run: python -m pytest -q

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Vitest
        working-directory: frontend
        run: pnpm test

      - name: Production build + typecheck
        working-directory: frontend
        run: pnpm build

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: pnpm audit

  # End-to-end: Playwright drives the real SPA against a live FastAPI +
  # PostgreSQL (previously never ran in CI — the 16 e2e spec files were
  # documentation only, audit 2026-08-08 N7).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # playwright.config.ts's webServer boots both backend and Next dev
      # server; the backend needs a DB URL and the auth limiter off (E2E
      # register flow bursts past the per-IP window).
      GOATFARM_DATABASE_URL: postgresql+asyncpg://runner@localhost:5432/goatfarm_e2e
      GOATFARM_AUTH_RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create runner Postgres role
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE goatfarm_e2e OWNER runner"

      - name: Enable pnpm
        run: corepack enable

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Sanity-check the Dockerfile still builds so a broken image doesn't
  # land on main unnoticed (audit 2026-08-08 LOW ops).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: goatfarm-backend:ci
      - name: Import-check the built image
        run: docker run --rm --entrypoint python goatfarm-backend:ci -c "import app.main; print('ok')"
