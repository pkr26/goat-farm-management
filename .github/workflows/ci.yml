name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR so we don't burn minutes on stale
# commits. Every merged main commit still gets a complete, uncancelled run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  migration-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Applied Alembic revisions are immutable
        # An in-place edit of an already-shipped revision desynchronizes
        # every database that already applied it — c8f1d3a5e709's first
        # variant silently rewrote ledger rows on databases that had not yet
        # migrated, and databases that HAD migrated were left with no record
        # of the change (2026-09-20 audit P2-14). New migrations are
        # additions; modifying/renaming/deleting an existing
        # backend/alembic/versions/*.py must ship as a NEW revision instead.
        #
        # The one sanctioned exception: a defect INSIDE an applied revision's
        # own DDL (a child-wipe ordering that FK-aborts, a guarded UPDATE a
        # later trigger rejects) can never be pre-empted by a later revision —
        # the broken statement runs before any successor gets a turn, so the
        # correction must edit the revision itself. Both DB populations stay
        # safe because alembic runs each revision transactionally (a database
        # that aborted sits at the prior revision and re-runs the fixed file;
        # a database that succeeded had no matching rows, making the added
        # statements no-ops). The allowlist is deliberately explicit, per file
        # and per incident, so the gate stays closed to everything else.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          # 2026-09-20 audit P1-6 (bd201c1cdc1b: wipe feed lines/finished
          # stock before recipes) and P2-13 (b5d7f9a1c3e5: detach ORF-linked
          # health_events before the template delete, behind the trigger).
          sanctioned="backend/alembic/versions/bd201c1cdc1b_goat_only_simplification.py backend/alembic/versions/b5d7f9a1c3e5_backfill_species_reference_data.py"
          touched="$(git diff --name-only --diff-filter=MDR "$range" -- 'backend/alembic/versions/' || true)"
          unexpected=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case " $sanctioned " in
              *" $file "*) echo "::notice::Sanctioned in-place correction (2026-09-20 audit P1-6/P2-13): $file" ;;
              *) unexpected="${unexpected}${file}"$'\n' ;;
            esac
          done <<< "$touched"
          if [ -n "$unexpected" ]; then
            echo "::error::Modified or deleted applied-migration files (ship corrections as NEW revisions):"
            printf '%s' "$unexpected"
            exit 1
          fi
          echo "no unsanctioned applied revision was modified — immutability holds"

  backend:
    runs-on: ubuntu-latest
    # pytest drives a real PostgreSQL and is the only slow step here — every
    # other step in this job finishes inside a minute. With 3,200+ tests it can
    # exceed 35 minutes on a hosted runner, and coverage instrumentation
    # (--cov=app) adds roughly 15–25% on top, so keep enough headroom for both
    # plus runner variance and the dependency audit after pytest.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Cache uv downloads
        # uv keeps its own wheel cache; setup-python's pip cache never sees it
        # (the only pip install is the uv wheel itself). Cache uv's directory
        # keyed on the lockfile instead.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # conftest connects to postgres without an explicit user, i.e. as the
      # runner OS user — give that role superuser so it can create the test DB.
      - name: Create runner Postgres role
        run: psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"

      - name: Install backend (+ dev tools)
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir uv==0.12.1
          # --frozen installs uv.lock as-is and never compares it to
          # pyproject.toml, so a dependency bump that was not re-locked would
          # be silently dropped here and in the production image. --check fails
          # the build instead.
          uv lock --check
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: mypy --strict (app + scripts)
        working-directory: backend
        run: python -m mypy --strict app scripts

      - name: OpenAPI snapshot is current
        working-directory: backend
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../shared/openapi.json

      - name: Migration round-trip and metadata drift check
        working-directory: backend
        env:
          GOATFARM_DATABASE_URL: postgresql+asyncpg://localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check
          # Exercise the complete historical chain in both directions.  A
          # partial downgrade can leave early revisions permanently untested
          # until a real restore or rollback needs them.
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: pytest (real PostgreSQL, coverage floor)
        working-directory: backend
        env:
          GOATFARM_TEST_DB: goatfarm_test
        # --cov + --cov-branch turn the run into a ratchet: a change that
        # drops app-wide line/branch coverage below the floor fails the build instead of silently
        # eroding it. The floor itself is single-sourced in pyproject.toml
        # ([tool.coverage.report] fail_under) — pytest-cov reads it there, so
        # a local instrumented run enforces the same gate. It is deliberately
        # modest (the integration suite covers routers/services heavily;
        # seed/lifecycle code drags the aggregate down) — raise it toward the
        # measured value, never above it.
        run: python -m pytest -q --cov=app --cov-branch --cov-report=term --cov-report=xml

      - name: Upload backend coverage report
        # Keep the measured number auditable from CI history — without a
        # retained report the "measured X%" claims can never be re-derived
        # after the console log scrolls away.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements.txt \
            --output-file /tmp/goatfarm-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/goatfarm-requirements.txt

  frontend:
    runs-on: ubuntu-latest
    # Headroom for the coverage-instrumented Vitest run plus the production
    # build, which are the two slow steps in this job. A fast workstation
    # finishes the instrumented suite in ~6 min, but the 2-core shared CI
    # runners need 4-6x that; 25 min was measured to be too tight (the job
    # was killed mid-suite), so budget for the slow-runner worst case.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable pnpm (pinned via packageManager)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: TypeScript
        working-directory: frontend
        run: pnpm typecheck

      - name: Generated API client is current
        working-directory: frontend
        run: |
          pnpm orval
          git diff --exit-code -- src/api/generated

      - name: Vitest (coverage thresholds enforced)
        working-directory: frontend
        # test:coverage = `vitest run --coverage`; without --coverage the
        # thresholds configured in vitest.config.ts (90/87/90/90
        # statements/branches/functions/lines) were never evaluated, so a
        # coverage regression could not fail this job. ~6 minutes locally
        # with two workers, but 4-6x slower on the 2-core shared runners —
        # the reason the job timeout above is 45 minutes. vitest.config.ts
        # raises the per-test/hook timeouts under CI for the same reason.
        run: pnpm test:coverage

      - name: Upload frontend coverage report
        # Same rationale as the backend report: retain the measured numbers
        # so the thresholds' headroom is auditable from CI history.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 30

      - name: Production build + typecheck
        working-directory: frontend
        run: pnpm build

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: pnpm audit --audit-level=low

  # End-to-end: Playwright drives the real SPA against a live FastAPI +
  # PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # playwright.config.ts's webServer boots both backend and a production
      # Next standalone server; the backend needs a DB URL and the auth
      # limiter off (E2E register flow bursts past the per-IP window).
      GOATFARM_DATABASE_URL: postgresql+asyncpg://runner@localhost:5432/goatfarm_e2e
      GOATFARM_AUTH_RATE_LIMIT_ENABLED: "false"
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Cache uv downloads
        # uv keeps its own wheel cache; setup-python's pip cache never sees it
        # (the only pip install is the uv wheel itself). Cache uv's directory
        # keyed on the lockfile instead.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Create runner Postgres role
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE runner LOGIN SUPERUSER"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE goatfarm_e2e OWNER runner"

      - name: Enable pnpm
        run: corepack enable

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir uv==0.12.1
          # --frozen installs uv.lock as-is and never compares it to
          # pyproject.toml, so a dependency bump that was not re-locked would
          # be silently dropped here and in the production image. --check fails
          # the build instead.
          uv lock --check
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright e2e
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Sanity-check the Dockerfile still builds so a broken image doesn't
  # land on main unnoticed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: goatfarm-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: goatfarm-frontend:ci
      - name: Exercise authentication in the built image
        run: |
          docker run --rm --network host \
            -e GOATFARM_DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/postgres \
            goatfarm-backend:ci alembic upgrade head
          docker run --rm --detach --name goatfarm-backend-smoke --network host \
            -e GOATFARM_DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/postgres \
            -e GOATFARM_AUTH_RATE_LIMIT_ENABLED=false \
            goatfarm-backend:ci
          cleanup() {
            docker logs goatfarm-backend-smoke || true
            docker stop goatfarm-backend-smoke || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Built image did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          response="$(curl --fail-with-body --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"container-smoke@example.com","password":"containerpass123"}' \
            http://localhost:8000/api/auth/register)"
          test "$(jq -r '.access_token | type' <<<"$response")" = "string"
