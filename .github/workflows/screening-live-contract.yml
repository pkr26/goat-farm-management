name: Screening live sandbox contract

on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screening-live-contract
  cancel-in-progress: false

jobs:
  probe:
    name: Storage and provider boundary probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: screening-contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install frozen backend runtime
        working-directory: backend
        run: |
          python -m pip install --no-cache-dir --require-hashes -r pins/uv.txt
          uv lock --check
          uv sync --locked

      - name: Probe configured sandbox boundaries
        working-directory: backend
        # Credentials are scoped to this process: checkout, dependency
        # installation, and artifact upload never receive them.
        env:
          # This variable is the explicit cost-bearing opt-in. Empty/false
          # produces a successful skipped report; once true, drift fails.
          SCREENING_CONTRACT_ENABLED: ${{ vars.SCREENING_CONTRACT_ENABLED }}
          GOATFARM_SCREENING_ENABLED: "true"
          GOATFARM_S3_ENDPOINT_URL: ${{ vars.GOATFARM_S3_ENDPOINT_URL }}
          GOATFARM_S3_REGION: ${{ vars.GOATFARM_S3_REGION || 'us-east-1' }}
          GOATFARM_S3_BUCKET: ${{ secrets.GOATFARM_S3_BUCKET }}
          GOATFARM_S3_ACCESS_KEY_ID: ${{ secrets.GOATFARM_S3_ACCESS_KEY_ID }}
          GOATFARM_S3_SECRET_ACCESS_KEY: ${{ secrets.GOATFARM_S3_SECRET_ACCESS_KEY }}
          GOATFARM_SCREENING_S3_PREFIX: contract-probe
          GOATFARM_SCREENING_PROVIDER: ${{ vars.GOATFARM_SCREENING_PROVIDER || 'anthropic' }}
          GOATFARM_SCREENING_ANTHROPIC_BASE_URL: ${{ vars.GOATFARM_SCREENING_ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
          GOATFARM_SCREENING_ANTHROPIC_MODEL: ${{ vars.GOATFARM_SCREENING_ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
          GOATFARM_SCREENING_ANTHROPIC_API_KEY: ${{ secrets.GOATFARM_SCREENING_ANTHROPIC_API_KEY }}
          GOATFARM_SCREENING_OPENAI_BASE_URL: ${{ vars.GOATFARM_SCREENING_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          GOATFARM_SCREENING_OPENAI_MODEL: ${{ vars.GOATFARM_SCREENING_OPENAI_MODEL || 'gpt-5' }}
          GOATFARM_SCREENING_OPENAI_API_KEY: ${{ secrets.GOATFARM_SCREENING_OPENAI_API_KEY }}
          # Optional rotation JSON, including sandbox keys, is one secret.
          GOATFARM_SCREENING_PROVIDER_ROTATION: ${{ secrets.GOATFARM_SCREENING_PROVIDER_ROTATION || '[]' }}
          GOATFARM_SCREENING_PROVIDER_TIMEOUT_SECONDS: "30"
        run: >-
          .venv/bin/python -m app.services.screening.live_contract
          --output screening-live-contract.json

      - name: Preserve sanitized contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screening-live-contract-${{ github.run_id }}
          path: backend/screening-live-contract.json
          if-no-files-found: error
          retention-days: 30
