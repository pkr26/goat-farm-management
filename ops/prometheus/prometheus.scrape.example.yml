scrape_configs:
  - job_name: goatfarm-api
    scheme: https
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/goatfarm-metrics-token
    static_configs:
      - targets: ["api.example.com"]

  - job_name: node
    static_configs:
      - targets: ["goatfarm-host.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["goatfarm-host.internal:8080"]

  - job_name: goatfarm-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://api.example.com/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.internal:9115

rule_files:
  - /etc/prometheus/rules/goatfarm.rules.yml
